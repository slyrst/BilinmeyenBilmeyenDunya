<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilinmeyen Dünya</title>
<link href="https://fonts.googleapis.com/css2?family=Linux+Libertine+Display&family=Linux+Libertine&family=Linux+Biolinum&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f8f9fa;--white:#ffffff;--border:#a7d7f9;--link:#3366cc;
  --text:#202122;--muted:#72777d;--toolbar-bg:#eaf3fb;--toolbar-border:#a2a9b1;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Linux Libertine',Georgia,serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;}

/* HEADER */
#site-header{background:#fff;border-bottom:1px solid #a7d7f9;position:sticky;top:0;z-index:900;box-shadow:0 1px 3px rgba(0,0,0,.08);}
#header-inner{display:flex;align-items:center;max-width:1400px;margin:0 auto;padding:8px 16px;gap:10px;flex-wrap:wrap;}
#site-logo{font-family:'Linux Libertine Display',Georgia,serif;font-size:24px;color:var(--link);cursor:pointer;white-space:nowrap;}
#site-logo span{color:#cc3333;}
#site-tagline{font-size:11px;color:var(--muted);font-style:italic;border-left:1px solid #ddd;padding-left:10px;white-space:nowrap;}
#header-nav{margin-left:auto;display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
.nav-btn{padding:5px 11px;font-size:13px;font-family:'Linux Biolinum',Arial,sans-serif;border:1px solid var(--toolbar-border);background:linear-gradient(to bottom,#f8f9fa,#eaecf0);color:var(--text);cursor:pointer;border-radius:2px;}
.nav-btn:hover{background:linear-gradient(to bottom,#eaecf0,#d8dce4);}
.nav-btn.primary{background:linear-gradient(to bottom,#3679d8,#2a62c0);color:#fff;border-color:#2a5bad;}
.nav-btn.primary:hover{background:linear-gradient(to bottom,#2a62c0,#1e4fa0);}
#search-box{display:flex;border:1px solid var(--toolbar-border);border-radius:2px;overflow:hidden;}
#search-box input{padding:5px 9px;border:none;outline:none;font-size:13px;font-family:inherit;width:175px;}
#search-box button{padding:5px 9px;border:none;background:linear-gradient(to bottom,#f8f9fa,#eaecf0);cursor:pointer;border-left:1px solid var(--toolbar-border);}
#user-pill{font-size:12px;background:#eaf3fb;border:1px solid #a7d7f9;padding:3px 9px;border-radius:10px;color:#36c;cursor:pointer;white-space:nowrap;}
#user-pill.admin-pill{background:#fff3cd;border-color:#e8a000;color:#795500;}

/* LAYOUT */
#layout{max-width:1400px;margin:0 auto;padding:20px 16px 50px;display:flex;gap:20px;}
#sidebar{width:195px;flex-shrink:0;}
.sidebar-box{background:#fff;border:1px solid #a7d7f9;margin-bottom:12px;font-size:13px;}
.sidebar-box h3{background:#eaf3fb;border-bottom:1px solid #a7d7f9;padding:5px 10px;font-size:11px;font-family:'Linux Biolinum',Arial,sans-serif;font-weight:bold;color:#36c;text-transform:uppercase;letter-spacing:0.5px;}
.sidebar-box ul{list-style:none;padding:5px 0;}
.sidebar-box ul li a{display:block;padding:3px 10px;color:var(--link);text-decoration:none;cursor:pointer;}
.sidebar-box ul li a:hover{text-decoration:underline;}
.sidebar-count{padding:6px 10px;color:var(--muted);font-style:italic;}
#main-content{flex:1;min-width:0;}

/* PAGE */
.page-wrap{background:#fff;border:1px solid #a7d7f9;}
.page-tabs{display:flex;border-bottom:1px solid #a7d7f9;background:#f8f9fa;padding:6px 10px 0;gap:2px;}
.page-tab{padding:5px 13px;font-size:13px;font-family:'Linux Biolinum',Arial,sans-serif;border:1px solid #a7d7f9;border-bottom:none;background:#fff;cursor:pointer;border-radius:3px 3px 0 0;color:var(--link);position:relative;bottom:-1px;}
.page-tab:hover{background:#eaf3fb;}
.page-tab.active{background:#fff;border-bottom:1px solid #fff;color:var(--text);font-weight:bold;}
.page-actions{margin-left:auto;display:flex;align-items:flex-end;padding-bottom:4px;gap:5px;}
.page-action-link{font-size:12px;color:var(--link);cursor:pointer;padding:2px 4px;}
.page-action-link:hover{text-decoration:underline;}
.page-action-link.red{color:#cc3333;}
.page-body{padding:18px 22px;}
.article-title-h1{font-family:'Linux Libertine Display',Georgia,serif;font-size:27px;font-weight:normal;border-bottom:1px solid #a7d7f9;padding-bottom:4px;margin-bottom:14px;}
.article-meta{font-size:12px;color:var(--muted);margin-bottom:12px;font-style:italic;}

/* VIEWER */
.viewer-canvas{position:relative;background:#fff;overflow:hidden;}
.view-block{position:absolute;overflow:visible;font-family:'Linux Libertine',Georgia,serif;font-size:15px;line-height:1.6;}
.view-block img{max-width:100%;height:100%;display:block;object-fit:contain;border:1px solid #ddd;}

/* ARTICLE LIST */
.article-card{border-bottom:1px solid #eaecf0;padding:11px 0;}
.article-card:last-child{border-bottom:none;}
.article-card-title{font-family:'Linux Libertine Display',Georgia,serif;font-size:18px;font-weight:normal;}
.article-card-title a{color:var(--link);text-decoration:none;cursor:pointer;}
.article-card-title a:hover{text-decoration:underline;}
.article-card-meta{font-size:12px;color:var(--muted);margin-top:2px;font-style:italic;}
.article-card-excerpt{font-size:13px;color:#555;margin-top:3px;}
.empty-state{text-align:center;padding:55px 20px;color:var(--muted);font-style:italic;}

/* EDITOR */
.editor-wrap{padding:14px;}
.editor-title-input{font-family:'Linux Libertine Display',Georgia,serif;font-size:23px;width:100%;border:none;border-bottom:2px solid #a7d7f9;padding:5px 0;margin-bottom:10px;outline:none;color:var(--text);background:transparent;}
.editor-title-input::placeholder{color:#aaa;}
.editor-location-input{font-family:inherit;font-size:13px;width:280px;border:1px solid var(--toolbar-border);padding:4px 8px;margin-bottom:12px;outline:none;color:var(--muted);}

/* TOOLBAR */
.wiki-toolbar{background:var(--toolbar-bg);border:1px solid var(--toolbar-border);border-bottom:none;padding:3px 5px;display:flex;flex-wrap:wrap;gap:1px;align-items:center;}
.toolbar-group{display:flex;gap:1px;border-right:1px solid #c0c8d0;padding-right:4px;margin-right:2px;}
.toolbar-group:last-child{border-right:none;}
.tb{padding:3px 6px;font-size:12px;font-family:'Linux Biolinum',Arial,sans-serif;border:1px solid transparent;background:transparent;cursor:pointer;border-radius:2px;color:var(--text);white-space:nowrap;min-width:22px;text-align:center;line-height:1.4;}
.tb:hover{background:#d8e8f8;border-color:#88aade;}
.tb:active{background:#c0d8f0;}
select.tb-select{padding:2px 5px;font-size:12px;font-family:'Linux Biolinum',Arial,sans-serif;border:1px solid var(--toolbar-border);background:white;cursor:pointer;border-radius:2px;}
input.tb-color{width:26px;height:22px;border:1px solid var(--toolbar-border);padding:1px;cursor:pointer;border-radius:2px;}
.toolbar-label{font-size:10px;color:var(--muted);padding:0 2px;font-family:'Linux Biolinum',Arial,sans-serif;}

/* EDITOR CANVAS */
.editor-canvas{border:1px solid var(--toolbar-border);min-height:580px;position:relative;background:white;overflow:hidden;cursor:default;}
.editor-canvas-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:15px;font-style:italic;pointer-events:none;user-select:none;}

/* BLOCKS */
.e-block{position:absolute;border:1px dashed transparent;cursor:move;min-width:60px;min-height:24px;}
.e-block:hover{border-color:#88aade !important;}
.e-block.selected{border:1px solid #3679d8 !important;box-shadow:0 0 0 2px rgba(54,121,216,.18);}
.e-block-inner{width:100%;height:100%;outline:none;font-family:'Linux Libertine',Georgia,serif;font-size:15px;line-height:1.6;color:var(--text);overflow:auto;padding:4px 6px;word-break:break-word;}
.e-block-inner:focus{cursor:text;}
.e-block img{max-width:100%;height:100%;display:block;pointer-events:none;object-fit:contain;}

/* RESIZE */
.rh{width:9px;height:9px;background:#3679d8;border:1px solid white;position:absolute;border-radius:2px;z-index:10;}
.rh-se{right:-5px;bottom:-5px;cursor:se-resize;}
.rh-sw{left:-5px;bottom:-5px;cursor:sw-resize;}
.rh-ne{right:-5px;top:-5px;cursor:ne-resize;}
.rh-nw{left:-5px;top:-5px;cursor:nw-resize;}
.rh-n{left:50%;top:-5px;transform:translateX(-50%);cursor:n-resize;}
.rh-s{left:50%;bottom:-5px;transform:translateX(-50%);cursor:s-resize;}
.rh-e{right:-5px;top:50%;transform:translateY(-50%);cursor:e-resize;}
.rh-w{left:-5px;top:50%;transform:translateY(-50%);cursor:w-resize;}
.block-delete{position:absolute;top:-10px;right:-10px;width:17px;height:17px;background:#cc3333;color:white;border:none;border-radius:50%;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;z-index:20;}
.block-delete:hover{background:#aa2222;}

.editor-bottombar{background:#f8f9fa;border:1px solid var(--toolbar-border);border-top:none;padding:6px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.btn-save{padding:6px 18px;background:linear-gradient(to bottom,#3679d8,#2a62c0);color:white;border:1px solid #2a5bad;cursor:pointer;font-family:'Linux Biolinum',Arial,sans-serif;font-size:14px;border-radius:2px;}
.btn-save:hover{background:linear-gradient(to bottom,#2a62c0,#1e4fa0);}
.btn-cancel{padding:6px 13px;background:linear-gradient(to bottom,#f8f9fa,#eaecf0);border:1px solid var(--toolbar-border);cursor:pointer;font-family:'Linux Biolinum',Arial,sans-serif;font-size:14px;border-radius:2px;}

/* EMOJI */
#emoji-picker{position:fixed;z-index:800;background:white;border:1px solid #a7d7f9;box-shadow:0 4px 16px rgba(0,0,0,.2);padding:8px;display:none;width:290px;border-radius:4px;}
#emoji-picker input{width:100%;border:1px solid var(--toolbar-border);padding:4px 8px;font-size:13px;margin-bottom:6px;outline:none;border-radius:2px;}
#emoji-grid{display:flex;flex-wrap:wrap;gap:1px;max-height:185px;overflow-y:auto;}
#emoji-grid span{font-size:22px;cursor:pointer;padding:3px;border-radius:3px;line-height:1;display:inline-block;}
#emoji-grid span:hover{background:#eaf3fb;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;}
.modal-box{background:white;border:1px solid #a7d7f9;width:500px;max-width:95vw;box-shadow:0 4px 24px rgba(0,0,0,.25);font-size:14px;border-radius:2px;}
.modal-header{background:#eaf3fb;border-bottom:1px solid #a7d7f9;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;font-family:'Linux Biolinum',Arial,sans-serif;font-weight:bold;font-size:14px;color:#36c;}
.modal-close{background:none;border:none;cursor:pointer;font-size:17px;color:#666;padding:0 3px;}
.modal-close:hover{color:#cc3333;}
.modal-body{padding:16px;}
.modal-body label{display:block;font-weight:bold;margin-bottom:4px;font-family:'Linux Biolinum',Arial,sans-serif;font-size:13px;}
.modal-body input,.modal-body textarea,.modal-body select{width:100%;border:1px solid var(--toolbar-border);padding:7px 10px;font-size:14px;font-family:inherit;outline:none;margin-bottom:11px;border-radius:2px;}
.modal-body input:focus{border-color:#3679d8;box-shadow:0 0 0 2px rgba(54,121,216,.12);}
.modal-preview{border:1px solid #ddd;min-height:80px;display:flex;align-items:center;justify-content:center;margin-bottom:11px;background:#fafafa;overflow:hidden;border-radius:2px;}
.modal-preview img{max-width:100%;max-height:200px;object-fit:contain;}
.no-preview{color:#aaa;font-style:italic;font-size:13px;}
.modal-footer{background:#f8f9fa;border-top:1px solid #eaecf0;padding:9px 14px;display:flex;gap:7px;justify-content:flex-end;}
.modal-footer button{padding:6px 15px;font-family:'Linux Biolinum',Arial,sans-serif;font-size:13px;cursor:pointer;border-radius:2px;}
#modal-ok{background:linear-gradient(to bottom,#3679d8,#2a62c0);color:white;border:1px solid #2a5bad;}
#modal-ok:hover{background:linear-gradient(to bottom,#2a62c0,#1e4fa0);}
#modal-cancel{background:linear-gradient(to bottom,#f8f9fa,#eaecf0);border:1px solid var(--toolbar-border);color:var(--text);}
.modal-err{color:#cc3333;font-size:12px;margin:-6px 0 8px;}

/* NOTICE */
.notice{border-left:3px solid #36c;background:#eaf3fb;padding:8px 12px;margin-bottom:12px;font-size:13px;color:#36c;font-family:'Linux Biolinum',Arial,sans-serif;}
.notice.warn{border-color:#e8a000;background:#fef6e7;color:#795500;}
.notice.success{border-color:#4a7d44;background:#eafaea;color:#2d5a27;}

/* STATUS */
#status-bar{position:fixed;bottom:0;left:0;right:0;background:#eaf3fb;border-top:1px solid #a7d7f9;padding:3px 12px;font-size:11px;color:var(--muted);font-family:'Linux Biolinum',Arial,sans-serif;z-index:800;display:flex;gap:16px;}

/* ADMIN */
.pending-card{border:1px solid #e8a000;background:#fffbe6;padding:10px 14px;margin-bottom:10px;border-radius:2px;}
.pending-card h4{font-family:'Linux Libertine Display',Georgia,serif;font-size:16px;font-weight:normal;margin-bottom:4px;}
.pending-card .pm{font-size:12px;color:var(--muted);margin-bottom:8px;}
.pending-actions{display:flex;gap:8px;}
.btn-approve{padding:4px 12px;background:#4a7d44;color:white;border:none;cursor:pointer;border-radius:2px;font-size:13px;}
.btn-approve:hover{background:#3a6234;}
.btn-reject{padding:4px 12px;background:#cc3333;color:white;border:none;cursor:pointer;border-radius:2px;font-size:13px;}
.btn-reject:hover{background:#aa2222;}
.pending-badge{display:inline-block;background:#cc3333;color:white;border-radius:10px;padding:0 6px;font-size:11px;margin-left:4px;}

/* AUTH */
.auth-tab-btn{flex:1;padding:7px;border:1px solid #a7d7f9;background:#eaf3fb;color:#36c;cursor:pointer;font-family:'Linux Biolinum',Arial,sans-serif;font-size:14px;}
.auth-tab-btn.on{background:#3679d8;color:white;border-color:#2a5bad;}
.auth-input{width:100%;border:1px solid var(--toolbar-border);padding:8px 11px;font-size:14px;font-family:inherit;outline:none;margin-bottom:10px;border-radius:2px;display:block;}
.auth-input:focus{border-color:#3679d8;box-shadow:0 0 0 2px rgba(54,121,216,.12);}
.auth-submit{width:100%;padding:9px;background:linear-gradient(to bottom,#3679d8,#2a62c0);color:white;border:none;cursor:pointer;font-size:15px;font-family:'Linux Biolinum',Arial,sans-serif;border-radius:2px;margin-bottom:10px;}
.auth-submit:hover{background:linear-gradient(to bottom,#2a62c0,#1e4fa0);}

@media(max-width:768px){#sidebar{display:none;}#layout{padding:10px;}}
</style>
</head>
<body>

<!-- HEADER -->
<header id="site-header">
  <div id="header-inner">
    <div id="site-logo" onclick="goHome()">Bilinmeyen Bilmeyen <span>Dünya</span></div>
    <div id="site-tagline">Anonim Türkçe Arşiv</div>
    <div id="search-box">
      <input type="text" id="search-input" placeholder="Ara…" onkeydown="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()">🔍</button>
    </div>
    <div id="header-nav">
      <button class="nav-btn" onclick="goHome()">Ana Sayfa</button>
      <button class="nav-btn" onclick="goRandom()">🎲 Rastgele</button>
      <button class="nav-btn primary" onclick="openEditor()">+ Yeni Sayfa</button>
      <span id="user-pill" onclick="toggleUserMenu()">Giriş Yap</span>
    </div>
  </div>
</header>

<!-- LAYOUT -->
<div id="layout">
  <aside id="sidebar">
    <div class="sidebar-box">
      <h3>Navigasyon</h3>
      <ul>
        <li><a onclick="goHome()">Ana Sayfa</a></li>
        <li><a onclick="openEditor()">Yeni Sayfa Oluştur</a></li>
        <li><a onclick="goRandom()">🎲 Rastgele Sayfa</a></li>
        <li id="admin-nav-li" style="display:none"><a onclick="navigate('admin')">⚙️ Admin Paneli <span class="pending-badge" id="sidebar-pending-count" style="display:none">0</span></a></li>
      </ul>
    </div>
    <div class="sidebar-box">
      <h3>İstatistik</h3>
      <div class="sidebar-count" id="article-count">Yükleniyor…</div>
    </div>
    <div class="sidebar-box">
      <h3>Araçlar</h3>
      <ul>
        <li><a onclick="openEditor()">İçerik Ekle</a></li>
        <li><a onclick="showLoginModal()">Giriş / Kayıt</a></li>
      </ul>
    </div>
  </aside>
  <main id="main-content"></main>
</div>

<!-- STATUS BAR -->
<div id="status-bar">
  <span id="status-msg">Hazır</span>
  <span id="status-blocks"></span>
  <span style="margin-left:auto;">© 2026 Bilinmeyen Dünya — anonim açık arşiv</span>
</div>

<!-- MODAL -->
<div id="modal-overlay" class="modal-overlay" style="display:none;" onclick="closeModalOutside(event)">
  <div class="modal-box">
    <div class="modal-header">
      <span id="modal-title">İşlem</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer">
      <button id="modal-cancel" onclick="closeModal()">İptal</button>
      <button id="modal-ok" onclick="confirmModal()">Tamam</button>
    </div>
  </div>
</div>

<!-- EMOJI PICKER -->
<div id="emoji-picker">
  <input type="text" id="emoji-search" placeholder="Emoji ara…" oninput="filterEmojis(this.value)">
  <div id="emoji-grid"></div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
/* ══ FIREBASE ══ */
const firebaseConfig = {
  apiKey: "AIzaSyDAR05cMYAUjkub0smCQHpUZeoGPYe5vL0",
  authDomain: "bbd1-df752.firebaseapp.com",
  projectId: "bbd1-df752",
  storageBucket: "bbd1-df752.firebasestorage.app",
  messagingSenderId: "969753899093",
  appId: "1:969753899093:web:47b337dff43a0af4cde4dc",
  measurementId: "G-G7L3FHFEV9"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ══ AUTH ══ */
const ADMIN_USER="sly", ADMIN_PASS="sevil177";
let currentUser = null;

function loadSession(){
  try{ const s=sessionStorage.getItem("bbd_u"); if(s) currentUser=JSON.parse(s); }catch(e){}
  updateUserPill(); updateAdminNav();
}
function saveSession(u){ currentUser=u; sessionStorage.setItem("bbd_u",JSON.stringify(u)); }
function clearSession(){ currentUser=null; sessionStorage.removeItem("bbd_u"); }
function isAdmin(){ return currentUser&&currentUser.role==="admin"; }
function isLoggedIn(){ return !!currentUser; }

function updateUserPill(){
  const p=document.getElementById("user-pill");
  if(!currentUser){ p.textContent="Giriş Yap"; p.className=""; return; }
  p.textContent=(isAdmin()?"⚙️ ":"👤 ")+currentUser.username;
  p.className=isAdmin()?"admin-pill":"";
}
function updateAdminNav(){
  document.getElementById("admin-nav-li").style.display=isAdmin()?"block":"none";
  if(isAdmin()) refreshPendingCount();
}
function refreshPendingCount(){
  db.ref("pending").once("value",snap=>{
    const n=snap.val()?Object.keys(snap.val()).length:0;
    const b=document.getElementById("sidebar-pending-count");
    if(b){ b.textContent=n; b.style.display=n>0?"inline-block":"none"; }
  });
}

function toggleUserMenu(){
  if(!currentUser){ showLoginModal(); return; }
  showConfirmModal(`"${currentUser.username}" olarak çıkış yap?`,()=>{
    clearSession(); updateUserPill(); updateAdminNav(); setStatus("Çıkış yapıldı.");
  });
}

/* ── SHOW LOGIN MODAL ── */
function showLoginModal(){
  document.getElementById("modal-title").textContent="Giriş Yap / Kayıt Ol";
  document.getElementById("modal-footer").style.display="none";
  document.getElementById("modal-body").innerHTML=`
    <div style="display:flex;gap:0;margin-bottom:14px;">
      <button class="auth-tab-btn on" id="atab-login" onclick="switchAuthTab('login')">Giriş Yap</button>
      <button class="auth-tab-btn" id="atab-reg" onclick="switchAuthTab('reg')" style="border-left:none;border-radius:0 2px 2px 0;">Kayıt Ol</button>
    </div>
    <div id="auth-err" class="modal-err" style="display:none"></div>
    <div id="auth-login">
      <input class="auth-input" id="l-user" placeholder="Kullanıcı Adı" autocomplete="username">
      <input class="auth-input" type="password" id="l-pass" placeholder="Şifre" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="auth-submit" onclick="doLogin()">Giriş Yap</button>
    </div>
    <div id="auth-reg" style="display:none">
      <input class="auth-input" id="r-user" placeholder="Kullanıcı Adı (min 3 karakter)" autocomplete="off">
      <input class="auth-input" type="password" id="r-pass" placeholder="Şifre (min 6 karakter)" onkeydown="if(event.key==='Enter')doRegister()">
      <button class="auth-submit" onclick="doRegister()">Kayıt Ol</button>
    </div>`;
  document.getElementById("modal-overlay").style.display="flex";
  setTimeout(()=>{ const e=document.getElementById("l-user"); if(e)e.focus(); },60);
}
function switchAuthTab(tab){
  const isL=tab==="login";
  document.getElementById("auth-login").style.display=isL?"block":"none";
  document.getElementById("auth-reg").style.display=isL?"none":"block";
  document.getElementById("atab-login").className="auth-tab-btn"+(isL?" on":"");
  document.getElementById("atab-reg").className="auth-tab-btn"+(isL?"":" on");
  document.getElementById("auth-err").style.display="none";
}
function authErr(msg){ const e=document.getElementById("auth-err"); if(e){e.textContent=msg;e.style.display="block";} }

function doLogin(){
  const u=(document.getElementById("l-user").value||"").trim();
  const p=(document.getElementById("l-pass").value||"").trim();
  if(!u||!p){ authErr("Kullanıcı adı ve şifre gerekli."); return; }
  if(u===ADMIN_USER&&p===ADMIN_PASS){
    saveSession({username:u,role:"admin"}); closeModal(); updateUserPill(); updateAdminNav();
    setStatus("Admin girişi: "+u); return;
  }
  db.ref("users/"+u).once("value",snap=>{
    if(!snap.exists()){ authErr("Kullanıcı bulunamadı."); return; }
    const d=snap.val();
    if(d.password!==p){ authErr("Şifre yanlış."); return; }
    saveSession({username:u,role:d.role||"user"}); closeModal(); updateUserPill(); updateAdminNav();
    setStatus("Giriş yapıldı: "+u);
  });
}
function doRegister(){
  const u=(document.getElementById("r-user").value||"").trim();
  const p=(document.getElementById("r-pass").value||"").trim();
  if(u.length<3){ authErr("Kullanıcı adı en az 3 karakter."); return; }
  if(p.length<6){ authErr("Şifre en az 6 karakter."); return; }
  if(u===ADMIN_USER){ authErr("Bu ad kullanılamaz."); return; }
  db.ref("users/"+u).once("value",snap=>{
    if(snap.exists()){ authErr("Bu kullanıcı adı alınmış."); return; }
    db.ref("users/"+u).set({password:p,role:"user",createdAt:Date.now()},err=>{
      if(err){ authErr("Hata: "+err.message); return; }
      saveSession({username:u,role:"user"}); closeModal(); updateUserPill(); updateAdminNav();
      setStatus("Kayıt olundu: "+u);
    });
  });
}

function goRandom(){

function router(){
  closeEmojiPicker();
  const hash=location.hash.replace(/^#\/?/,"");
  if(hash.startsWith("article/")) loadArticle(hash.split("/")[1]);
  else if(hash.startsWith("editor/")) renderEditor(hash.split("/")[1]);
  else if(hash==="editor") renderEditor(null);
  else if(hash==="admin") renderAdmin();
  else renderHome();
}

function slugify(t){
  return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ş/g,"s")
    .replace(/ı/g,"i").replace(/ö/g,"o").replace(/ç/g,"c")
    .replace(/\s+/g,"-").replace(/[^\w\-]+/g,"").replace(/--+/g,"-").substring(0,80);
}

function setStatusBlocks(m){ document.getElementById("status-blocks").textContent=m; }

/* ══ ARTICLE VIEW ══ */
function loadArticle(slug){
  setStatus("Yükleniyor…");
  db.ref("articles/"+slug).once("value",snap=>{
    if(!snap.exists()){
      document.getElementById("main-content").innerHTML=`<div class="page-wrap"><div class="page-body"><div class="notice warn">Bu sayfa mevcut değil.</div><button class="btn-save" onclick="openEditor()">Sayfa Oluştur</button></div></div>`;
      setStatus("404"); return;
    }
    const a=snap.val();
    document.title=a.title+" — Bilinmeyen Dünya";
    setStatus("Yüklendi: "+a.title);
    const canvasH=computeCanvasH(a.blocks||[]);
    const bHtml=(a.blocks||[]).map(b=>{
      const w=b.width?`width:${b.width};`:"", h=b.height?`height:${b.height};`:"";
      if(b.type==="text") return `<div class="view-block" style="left:${b.left};top:${b.top};${w}${h}">${b.content}</div>`;
      return `<div class="view-block" style="left:${b.left};top:${b.top};${w}${h}"><img src="${escHtml(b.content)}" alt=""></div>`;
    }).join("");
    document.getElementById("main-content").innerHTML=`
      <div class="page-wrap">
        <div class="page-tabs">
          <span class="page-tab active">Sayfa</span>
          <span class="page-tab" onclick="navigate('editor/${slug}')">Düzenle</span>
          <div class="page-actions">
            <a class="page-action-link" onclick="navigate('editor/${slug}')">✏️ Düzenle</a>
            <a class="page-action-link red" onclick="deleteArticle('${slug}')">🗑️ Sil</a>
          </div>
        </div>
        <div class="page-body">
          <h1 class="article-title-h1">${escHtml(a.title)}</h1>
          <div class="article-meta">📍 ${escHtml(a.location||"Anonim")} &bull; 🕐 ${new Date(a.createdAt).toLocaleString("tr-TR")}${a.author?" &bull; ✍️ "+escHtml(a.author):""}</div>
          <div class="viewer-canvas" style="min-height:${canvasH}px;">${bHtml}</div>
        </div>
      </div>`;
  });
}
function computeCanvasH(blocks){
  let max=400;
  blocks.forEach(b=>{ max=Math.max(max,(parseInt(b.top)||0)+(parseInt(b.height)||150)+40); });
  return max;
}
function deleteArticle(slug){
  showConfirmModal("Bu sayfayı silmek istediğine emin misin?",()=>{
    db.ref("articles/"+slug).remove(()=>goHome());
  });
}

/* FORMAT */
function fmt(cmd){ ensureFocus(); document.execCommand(cmd,false,null); }
function applyColor(cmd,val){ ensureFocus(); document.execCommand(cmd,false,val); }
function applyFontSize(val){ if(!val)return; ensureFocus(); document.execCommand('fontSize',false,val); }
function applyHeading(val){
  ensureFocus();
  document.execCommand('formatBlock',false,val||'p');
  document.getElementById("heading-select").value="";
}
function ensureFocus(){
  const inner=getActiveInner();
  if(inner&&document.activeElement!==inner&&!inner.contains(document.activeElement)) inner.focus();
}
function getActiveInner(){
  if(activeInner) return activeInner;
  if(selectedBlock) return selectedBlock.querySelector(".e-block-inner");
  return null;
}
function edUndo(){ document.execCommand('undo',false,null); }
function edRedo(){ document.execCommand('redo',false,null); }

function insertLink(){
  showInputModal("🔗 Bağlantı Ekle",[
    {id:"lu",label:"URL:",placeholder:"https://…",type:"text"},
    {id:"lt",label:"Bağlantı Metni:",placeholder:"Görünen metin",type:"text"}
  ],vals=>{
    const url=vals.lu,text=vals.lt||vals.lu;
    ensureFocus();
    document.execCommand('insertHTML',false,`<a href="${escHtml(url)}" target="_blank">${escHtml(text)}</a>`);
  });
}
function insertTable(){
  showInputModal("⊞ Tablo Ekle",[
    {id:"tr",label:"Satır:",placeholder:"3",type:"number"},
    {id:"tc",label:"Sütun:",placeholder:"3",type:"number"}
  ],vals=>{
    const rows=parseInt(vals.tr)||3,cols=parseInt(vals.tc)||3;
    let html='<table border="1" style="border-collapse:collapse;width:100%;font-size:14px;">';
    for(let r=0;r<rows;r++){
      html+='<tr>';
      for(let c=0;c<cols;c++) html+=`<td style="border:1px solid #aaa;padding:5px 9px;">${r===0?`<b>Başlık ${c+1}</b>`:"Hücre"}</td>`;
      html+='</tr>';
    }
    html+='</table>';
    const inner=getActiveInner();
    if(inner){ inner.focus(); document.execCommand('insertHTML',false,html); } else addTextBlock(html);
  });
}

function updateBlockCount(){
  const canvas=document.getElementById("editor-canvas");
  if(!canvas) return;
  const n=canvas.querySelectorAll(".e-block").length;
  const hint=document.getElementById("canvas-hint");
  if(hint) hint.style.display=n>0?"none":"flex";
  const ce=document.getElementById("ed-block-count");
  if(ce) ce.textContent=n+" blok";
  setStatusBlocks(n+" blok");
}

function addTextBlock(initHtml){

function loadBlock(b){
  const canvas=document.getElementById("editor-canvas");
  if(!canvas) return;
  const block=createBlock(b.type,parseInt(b.left)||10,parseInt(b.top)||10);
  if(b.width) block.style.width=b.width;
  if(b.height) block.style.height=b.height;
  const inner=block.querySelector(".e-block-inner");
  if(b.type==="image"){
    inner.contentEditable=false;
    const img=document.createElement("img");
    img.src=b.content; img.draggable=false;
    inner.appendChild(img);
  } else inner.innerHTML=b.content||"";
  canvas.appendChild(block);
  updateBlockCount();
}

function createBlock(type,left,top){
  const block=document.createElement("div");
  block.className="e-block";
  block.dataset.type=type;
  block.id="block-"+(blockIdCounter++);
  block.style.left=left+"px";
  block.style.top=top+"px";

  const inner=document.createElement("div");
  inner.className="e-block-inner";
  if(type==="text"){
    inner.contentEditable=true;
    inner.spellcheck=true;
    inner.addEventListener("focus",()=>{ activeInner=inner; });
  }
  block.appendChild(inner);

  // Resize handles
  ["nw","n","ne","e","se","s","sw","w"].forEach(d=>{
    const h=document.createElement("div");
    h.className=`rh rh-${d}`;
    block.appendChild(h);
    makeResizable(block,h,d);
  });

  // Delete button
  const del=document.createElement("button");
  del.className="block-delete";
  del.innerHTML="✕";
  del.addEventListener("mousedown",e=>{e.stopPropagation();e.preventDefault();});
  del.addEventListener("click",e=>{
    e.stopPropagation();
    if(selectedBlock===block){selectedBlock=null;activeInner=null;}
    block.remove(); updateBlockCount();
  });
  block.appendChild(del);

  // ══════════════════════════════════════
  // DRAG LOGIC - THE KEY FIX
  // First click on unselected block → select it (no drag yet)
  // Second click on already-selected text block inner → allow typing
  // Drag only initiates with mouse MOVEMENT, not just mousedown
  // ══════════════════════════════════════
  block.addEventListener("mousedown",e=>{
    if(e.target.classList.contains("rh")||e.target.classList.contains("block-delete")) return;

    // If clicking on the inner of an ALREADY SELECTED text block → let the browser handle cursor placement
    if(type==="text" && block.classList.contains("selected") && inner.contains(e.target)){
      // Don't preventDefault — let normal click-to-position-cursor work
      return;
    }

    // Select the block
    selectBlock(block);

    // Start potential drag (only becomes real drag if mouse moves > 4px)
    const startX=e.clientX, startY=e.clientY;
    const origL=parseInt(block.style.left)||0, origT=parseInt(block.style.top)||0;
    let dragging=false;

    // Must preventDefault AFTER we know it's actually a drag, but we need to
    // track mousedown position. Compromise: preventDefault here but allow
    // re-focus on mouseup if no drag occurred.
    e.preventDefault();

    function onMove(mv){
      const dx=mv.clientX-startX, dy=mv.clientY-startY;
      if(!dragging&&(Math.abs(dx)>4||Math.abs(dy)>4)){
        dragging=true;
        block.style.opacity="0.82";
        block.style.zIndex="99";
      }
      if(dragging){
        block.style.left=Math.max(0,origL+dx)+"px";
        block.style.top=Math.max(0,origT+dy)+"px";
        setStatus(`X:${Math.max(0,origL+dx)}px Y:${Math.max(0,origT+dy)}px`);
      }
    }
    function onUp(up){
      document.removeEventListener("mousemove",onMove);
      document.removeEventListener("mouseup",onUp);
      block.style.opacity="";
      block.style.zIndex="";
      if(!dragging && type==="text"){
        // No drag happened — focus the inner so user can type
        inner.focus();
        activeInner=inner;
      }
      if(dragging) dragging=false;
    }
    document.addEventListener("mousemove",onMove);
    document.addEventListener("mouseup",onUp);
  });

  return block;
}

function selectBlock(block){
  if(selectedBlock&&selectedBlock!==block) selectedBlock.classList.remove("selected");
  selectedBlock=block;
  block.classList.add("selected");
}
function deselectAll(){
  if(selectedBlock){selectedBlock.classList.remove("selected");selectedBlock=null;}
}
function selectAllContent(el){
  const r=document.createRange(); r.selectNodeContents(el);
  const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
}

/* ══ RESIZE ══ */
function makeResizable(block,handle,dir){
  handle.addEventListener("mousedown",e=>{
    e.preventDefault(); e.stopPropagation();
    const sx=e.clientX,sy=e.clientY,sw=block.offsetWidth,sh=block.offsetHeight;
    const sl=parseInt(block.style.left)||0,st=parseInt(block.style.top)||0;
    function onMove(mv){
      const dx=mv.clientX-sx,dy=mv.clientY-sy;
      let w=sw,h=sh,l=sl,t=st;
      if(dir.includes("e")) w=Math.max(60,sw+dx);
      if(dir.includes("s")) h=Math.max(24,sh+dy);
      if(dir.includes("w")){w=Math.max(60,sw-dx);l=sl+(sw-w);}
      if(dir.includes("n")){h=Math.max(24,sh-dy);t=st+(sh-h);}
      block.style.width=w+"px"; block.style.height=h+"px";
      block.style.left=l+"px"; block.style.top=t+"px";
    }
    function onUp(){document.removeEventListener("mousemove",onMove);document.removeEventListener("mouseup",onUp);}
    document.addEventListener("mousemove",onMove);
    document.addEventListener("mouseup",onUp);
  });
}

/* ══ SAVE ══ */
function saveArticle(){
  const title=(document.getElementById("ed-title").value||"").trim();
  const location=(document.getElementById("ed-location").value||"").trim();
  if(!title){ alert("Lütfen bir başlık girin."); document.getElementById("ed-title").focus(); return; }

  const canvas=document.getElementById("editor-canvas");
  const blocks=[];
  canvas.querySelectorAll(".e-block").forEach(block=>{
    const type=block.dataset.type;
    const inner=block.querySelector(".e-block-inner");
    let content;
    if(type==="image"){const img=inner.querySelector("img");content=img?img.src:"";}
    else content=inner.innerHTML;
    blocks.push({type,left:block.style.left,top:block.style.top,width:block.style.width||null,height:block.style.height||null,content});
  });

  const slug=editingSlug||slugify(title);
  const payload={title,location,slug,blocks,createdAt:Date.now(),author:currentUser?currentUser.username:"Anonim"};
  setStatus("Kaydediliyor…");

  if(isAdmin()){
    db.ref("articles/"+slug).set(payload,err=>{
      if(err){alert("Hata: "+err.message);setStatus("Hata!");return;}
      setStatus("Kaydedildi!"); navigate("article/"+slug);
    });
  } else {
    // Send to pending for admin approval
    const pkey=slug+"_"+Date.now();
    db.ref("pending/"+pkey).set(payload,err=>{
      if(err){alert("Hata: "+err.message);setStatus("Hata!");return;}
      setStatus("Onaya gönderildi!");
      document.getElementById("main-content").innerHTML=`
        <div class="page-wrap"><div class="page-body">
          <div class="notice success">✅ İçeriğiniz admin onayına gönderildi! Onaylandıktan sonra yayınlanacak.</div>
          <button class="btn-save" onclick="goHome()" style="margin-top:10px">Ana Sayfaya Dön</button>
        </div></div>`;
    });
  }
}

function closeModalOutside(e){if(e.target.id==="modal-overlay")closeModal();}
function confirmModal(){

    if(inputs.length){const v={};inputs.forEach(i=>v[i.dataset.id]=i.value);modalCb(v);}

}

function showImageModal(cb){
  document.getElementById("modal-title").textContent="🖼️ Resim Ekle";
  document.getElementById("modal-footer").style.display="none";
  document.getElementById("modal-body").innerHTML=`
    <label>Resim URL'si:</label>
    <input type="text" id="img-url" placeholder="https://i.imgur.com/… veya başka bir URL" style="margin-bottom:8px;">
    <div style="display:flex;gap:8px;margin-bottom:10px;">
      <button onclick="confirmImgUrl()" style="flex:1;padding:7px;background:linear-gradient(to bottom,#3679d8,#2a62c0);color:white;border:none;cursor:pointer;border-radius:2px;font-family:inherit;font-size:13px;">✅ Ekle</button>
      <button onclick="closeModal()" style="padding:7px 14px;background:#eaecf0;border:1px solid #aaa;cursor:pointer;border-radius:2px;font-family:inherit;font-size:13px;">İptal</button>
    </div>
    <div class="modal-preview" id="img-preview"><span class="no-preview">URL gir → önizleme burada görünür</span></div>
    <p style="font-size:11px;color:var(--muted);margin-top:6px;">💡 Önerilen: imgur.com, wikimedia.org, i.postimg.cc — CORS'a izin veren siteler</p>`;
  const input=document.getElementById("img-url");
  const preview=document.getElementById("img-preview");
  input.addEventListener("input",()=>{
    const url=input.value.trim();
    if(!url){preview.innerHTML='<span class="no-preview">URL gir → önizleme burada görünür</span>';return;}
    preview.innerHTML=`<img src="${escHtml(url)}" onerror="this.parentElement.innerHTML='<span class=\\'no-preview\\'>❌ Resim yüklenemedi</span>'" style="max-width:100%;max-height:200px;object-fit:contain;">`;
  });
  input.addEventListener("keydown",e=>{if(e.key==="Enter")confirmImgUrl();});
  window._imgCb=cb;
  document.getElementById("modal-overlay").style.display="flex";
  setTimeout(()=>input.focus(),60);
}
function confirmImgUrl(){
  const url=(document.getElementById("img-url").value||"").trim();
  if(!url){alert("Lütfen bir URL girin.");return;}
  closeModal();
  if(window._imgCb){window._imgCb(url);window._imgCb=null;}
}

/* ══ SEARCH ══ */
function doSearch(){
  const q=(document.getElementById("search-input").value||"").trim().toLowerCase();
  if(!q) return;
  setStatus("Aranıyor: "+q);
  db.ref("articles").once("value",snap=>{
    const data=snap.val();
    const el=document.getElementById("main-content");
    if(!data){el.innerHTML=`<div class="page-wrap"><div class="page-body"><div class="notice warn">Sonuç bulunamadı.</div></div></div>`;return;}
    const res=Object.values(data).filter(a=>
      a.title.toLowerCase().includes(q)||(a.blocks||[]).some(b=>b.type==="text"&&stripTags(b.content).toLowerCase().includes(q)));
    document.title=`"${q}" — Bilinmeyen Dünya`;
    el.innerHTML=`
      <div class="page-wrap">
        <div class="page-tabs"><span class="page-tab active">Arama</span></div>
        <div class="page-body">
          <h1 class="article-title-h1">Arama: "${escHtml(q)}"</h1>
          <p style="color:var(--muted);margin-bottom:12px;">${res.length} sonuç</p>
          ${res.length?res.map(a=>`<div class="article-card">
            <div class="article-card-title"><a onclick="navigate('article/${a.slug}')">${escHtml(a.title)}</a></div>
            <div class="article-card-meta">${escHtml(a.location||"Anonim")} — ${new Date(a.createdAt).toLocaleString("tr-TR")}</div>
          </div>`).join(""):'<div class="empty-state">Sonuç bulunamadı.</div>'}
        </div>
      </div>`;
    setStatus(res.length+" sonuç");
  });
}

/* ══ UTILS ══ */
function escHtml(s){if(typeof s!=="string")return"";return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function stripTags(s){return(s||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();}
