<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bilinmeyen Dünya</title>
<style>
/* ═══════════════════════════════════════
   YOTSUBA BASE (4chan CSS adapted)
═══════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:arial,helvetica,sans-serif;font-size:10pt;
  background:#ffe;color:#800000;padding-top:24px;padding-bottom:50px;
}
a,a:visited{color:#0000ff;text-decoration:underline;}
a:hover{color:#d00;}
h1{font-family:tahoma;letter-spacing:-2px;font-size:20pt;text-align:center;color:#800000;}
h2{font-size:11pt;}
hr{border:none;border-top:1px solid #d9bfb7;height:0;clear:left;}
/* ── TOP NAV ── */
#topnav{
  position:fixed;top:0;left:0;right:0;z-index:9999;
  background:#e8722a;border-bottom:1px solid #c45a18;
  padding:2px 6px;font-size:9pt;white-space:nowrap;
  overflow-x:auto;display:flex;align-items:center;gap:4px;
  box-shadow:0 2px 6px rgba(0,0,0,.18);
}
#topnav::-webkit-scrollbar{height:0;}
#topnav a{color:#fff5ee!important;text-decoration:none;}
#topnav a:hover{color:#fff!important;text-decoration:underline;}
#topnav .sep{color:#f5b98a;margin:0 2px;}
#topnav strong{color:#fff;font-size:10pt;cursor:pointer;}
#topnav-right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-shrink:0;}
#search-wrap{display:flex;border:1px solid rgba(255,255,255,.3);border-radius:2px;overflow:hidden;background:rgba(255,255,255,.12);}
#search-wrap input{background:transparent;border:none;outline:none;padding:2px 7px;color:#fff;font-size:9pt;width:140px;}
#search-wrap input::placeholder{color:rgba(255,255,255,.6);}
#search-wrap button{background:transparent;border:none;border-left:1px solid rgba(255,255,255,.2);padding:2px 7px;cursor:pointer;color:#fff5ee;font-size:11px;}
#user-pill{font-size:9pt;cursor:pointer;color:#fff5ee!important;text-decoration:none;}
#user-pill:hover{color:#fff!important;}
#user-pill.admin-pill{color:#ffe278!important;font-weight:bold;}
#hamburger{background:none;border:none;cursor:pointer;color:#fff5ee;font-size:16px;padding:0 4px;display:none;}
/* ── LAYOUT ── */
#layout{display:flex;gap:12px;max-width:1000px;margin:0 auto;padding:10px 8px 60px;}
#sidebar{width:155px;flex-shrink:0;}
#main-content{flex:1;min-width:0;}
/* ── SIDEBAR ── */
.sbox{background:#f0e0d6;border:1px solid #d9bfb7;margin-bottom:8px;font-size:9pt;}
.sbox-head{background:#ea8;border-bottom:1px solid #d9bfb7;padding:2px 6px;font-weight:bold;font-size:9pt;color:#800;}
.sbox ul{list-style:none;padding:3px 0;}
.sbox ul li a{display:block;padding:2px 8px;color:#0000ff;text-decoration:none;font-size:9pt;}
.sbox ul li a:hover{text-decoration:underline;color:#d00;}
.sbox .sc{padding:4px 8px;color:#800;font-size:9pt;font-style:italic;}
.pending-badge{background:#d00;color:#fff;border-radius:8px;padding:0 5px;font-size:9px;margin-left:3px;}
#sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:850;}
#sb-overlay.on{display:block;}
#sidebar.mob-open{transform:translateX(0)!important;}
/* ── PAGE BOXES ── */
.page-wrap{margin-bottom:12px;}
.page-head{background:#ea8;border:1px solid #800;padding:3px 8px;display:flex;align-items:center;flex-wrap:wrap;gap:5px;}
.ph-tabs{display:flex;gap:3px;flex-wrap:wrap;}
.ph-tab{padding:2px 9px;font-size:9pt;border:1px solid #d9bfb7;background:#f0e0d6;cursor:pointer;color:#800000;text-decoration:none;}
.ph-tab.active{background:#fff;font-weight:bold;}
.ph-tab:hover:not(.active){background:#ffe0cc;}
.ph-actions{margin-left:auto;font-size:9pt;display:flex;gap:8px;align-items:center;}
.ph-actions a{color:#0000ff;cursor:pointer;text-decoration:none;}
.ph-actions a:hover{text-decoration:underline;color:#d00;}
.ph-actions a.red{color:#d00;}
.page-body{background:#fff9f0;border:1px solid #d9bfb7;border-top:none;padding:12px 14px;}
/* ── ARTICLE ── */
.art-title{font-size:14pt;font-weight:bold;color:#d00;margin-bottom:4px;font-family:tahoma,arial,sans-serif;}
.art-meta{font-size:9pt;color:#117743;margin-bottom:10px;}
.art-meta span{margin-right:8px;}
/* ── ARTICLE CARDS ── */
.acard{border-bottom:1px solid #e8d0c0;padding:8px 0;}
.acard:last-child{border-bottom:none;}
.acard-title{font-size:12pt;font-weight:bold;}
.acard-title a{color:#d00;text-decoration:none;}
.acard-title a:hover{text-decoration:underline;}
.acard-meta{font-size:9pt;color:#117743;margin-top:1px;}
.acard-excerpt{font-size:9pt;color:#555;margin-top:3px;}
.empty-state{text-align:center;padding:40px;color:#800;font-style:italic;}
/* ── VIEWER CANVAS ── */
.viewer-canvas{position:relative;background:#fffef0;min-height:300px;overflow:auto;border:1px solid #e8d8c8;}
.view-block{position:absolute;overflow:visible;font-size:10pt;line-height:1.6;color:#800000;}
.view-block img{max-width:100%;height:100%;display:block;object-fit:contain;border:1px solid #d9bfb7;}
.tpl-render{margin:4px 0;}
/* ── NOTICES ── */
.notice{border-left:3px solid #0000ff;background:#eef4ff;padding:6px 10px;margin-bottom:8px;font-size:9pt;color:#000080;}
.notice.warn{border-color:#e8a000;background:#fff8e0;color:#7a4a00;}
.notice.success{border-color:#117743;background:#eafaf0;color:#0a4427;}
/* ── EDITOR ── */
.editor-wrap{padding:0;}
.ed-title{font-family:tahoma,arial,sans-serif;font-size:16pt;font-weight:bold;width:100%;border:none;border-bottom:2px solid #d9bfb7;padding:3px 0;outline:none;background:transparent;color:#d00;margin-bottom:8px;}
.ed-title::placeholder{color:#dba;}
.ed-title:focus{border-bottom-color:#e87020;}
.ed-loc{font-size:9pt;border:1px solid #a9a9a9;padding:3px 7px;outline:none;width:220px;background:#fff;color:#800000;}
.ed-loc:focus{border-color:#e87020;}
/* ── TOOLBAR ── */
.wiki-tb{background:#f0e0d6;border:1px solid #d9bfb7;border-bottom:none;padding:2px 4px;display:flex;flex-wrap:wrap;gap:1px;align-items:center;overflow-x:auto;}
.wiki-tb::-webkit-scrollbar{height:0;}
.tbg{display:flex;gap:1px;border-right:1px solid #c8b8b0;padding-right:3px;margin-right:2px;flex-shrink:0;}
.tbg:last-child{border-right:none;}
.tb{padding:2px 6px;font-size:9pt;border:1px solid transparent;background:transparent;cursor:pointer;color:#800000;white-space:nowrap;min-width:22px;text-align:center;}
.tb:hover{background:#e8d0c0;border-color:#c8a890;}
.tb:active{background:#d8b8a0;}
select.tb-sel{padding:1px 4px;font-size:9pt;border:1px solid #a9a9a9;background:#fff;cursor:pointer;color:#800000;max-width:90px;}
.tb-cl{display:flex;align-items:center;gap:2px;font-size:9px;color:#800;}
input.tb-color{width:24px;height:20px;border:1px solid #a9a9a9;padding:0;cursor:pointer;}
/* ── EDITOR CANVAS ── */
.ed-canvas{border:1px solid #d9bfb7;min-height:480px;position:relative;background:linear-gradient(rgba(200,120,60,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(200,120,60,.04) 1px,transparent 1px),#fffef5;background-size:28px 28px;overflow:auto;cursor:default;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;}
.ed-canvas-inner{position:relative;min-width:800px;min-height:480px;}
.ed-canvas-hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#c8a090;font-size:10pt;font-style:italic;pointer-events:none;user-select:none;gap:6px;}
/* ── BLOCKS ── */
.e-block{position:absolute;border:1px dashed transparent;cursor:move;min-width:60px;min-height:24px;}
.e-block:hover{border-color:#e87020!important;}
.e-block.selected{border:1px solid #e87020!important;box-shadow:0 0 0 2px rgba(232,114,42,.2);}
.e-block-inner{width:100%;height:100%;outline:none;font-family:arial,helvetica,sans-serif;font-size:10pt;line-height:1.6;color:#800000;overflow:auto;padding:4px 6px;word-break:break-word;}
.e-block-inner:focus{cursor:text;}
.e-block img{max-width:100%;height:100%;display:block;pointer-events:none;object-fit:contain;}
/* ── RESIZE HANDLES ── */
.rh{width:8px;height:8px;background:#e87020;border:1px solid #fff;position:absolute;border-radius:1px;z-index:10;}
.rh-se{right:-4px;bottom:-4px;cursor:se-resize;} .rh-sw{left:-4px;bottom:-4px;cursor:sw-resize;}
.rh-ne{right:-4px;top:-4px;cursor:ne-resize;} .rh-nw{left:-4px;top:-4px;cursor:nw-resize;}
.rh-n{left:50%;top:-4px;transform:translateX(-50%);cursor:n-resize;}
.rh-s{left:50%;bottom:-4px;transform:translateX(-50%);cursor:s-resize;}
.rh-e{right:-4px;top:50%;transform:translateY(-50%);cursor:e-resize;}
.rh-w{left:-4px;top:50%;transform:translateY(-50%);cursor:w-resize;}
.block-del{position:absolute;top:-9px;right:-9px;width:16px;height:16px;background:#d00;color:#fff;border:1px solid #fff;border-radius:50%;cursor:pointer;font-size:9px;display:flex;align-items:center;justify-content:center;z-index:20;}
.block-del:hover{background:#a00;}
/* ── BOTTOM BAR ── */
.ed-bar{background:#f0e0d6;border:1px solid #d9bfb7;border-top:none;padding:5px 8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.btn-post{padding:2px 10px;background:#98e;border:1px solid #7799cc;color:#000;font-weight:bold;cursor:pointer;font-size:10pt;}
.btn-post:hover{background:#aaf;border-color:#6688bb;}
.btn-cancel{padding:2px 8px;background:#f0e0d6;border:1px solid #d9bfb7;cursor:pointer;font-size:10pt;color:#800;}
.btn-cancel:hover{background:#e8d0c0;}
/* ── IMAGE UPLOAD ── */
.img-up-wrap{border:2px dashed #d9bfb7;padding:16px 10px;text-align:center;cursor:pointer;background:#fffef0;font-size:9pt;color:#800;}
.img-up-wrap:hover,.img-up-wrap.dragover{border-color:#e87020;background:#fff5ea;}
.img-up-wrap input[type=file]{display:none;}
.upload-prev{display:none;gap:8px;align-items:center;padding:6px;background:#f0e0d6;border:1px solid #d9bfb7;margin-top:8px;}
.upload-prev.on{display:flex;}
.upload-prev img{max-width:56px;max-height:56px;object-fit:contain;border:1px solid #d9bfb7;background:#fff;}
.up-meta{flex:1;font-size:9pt;color:#800000;}
.up-name{font-weight:bold;word-break:break-all;}
.up-size{color:#888;font-size:8pt;}
.up-warn{color:#d00;font-size:8pt;display:none;}
.upload-clear{background:none;border:none;cursor:pointer;font-size:16px;color:#d00;padding:0 4px;}
/* ── EMOJI ── */
#emoji-picker{position:fixed;z-index:800;background:#fff;border:1px solid #d9bfb7;box-shadow:0 4px 16px rgba(0,0,0,.18);padding:6px;display:none;width:280px;}
#emoji-picker input{width:100%;border:1px solid #a9a9a9;padding:3px 7px;font-size:9pt;margin-bottom:5px;outline:none;}
#emoji-grid{display:flex;flex-wrap:wrap;gap:1px;max-height:160px;overflow-y:auto;}
#emoji-grid span{font-size:20px;cursor:pointer;padding:2px;line-height:1;display:inline-block;}
#emoji-grid span:hover{background:#f0e0d6;}
/* ── MODAL ── */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;}
.modal-box{background:#fff9f0;border:2px solid #d9bfb7;width:480px;max-width:96vw;box-shadow:0 6px 30px rgba(0,0,0,.3);max-height:90vh;display:flex;flex-direction:column;}
.modal-head{background:#ea8;border-bottom:1px solid #d9bfb7;padding:6px 12px;display:flex;align-items:center;justify-content:space-between;font-weight:bold;font-size:10pt;color:#800;}
.modal-close{background:none;border:none;cursor:pointer;font-size:16px;color:#800;padding:0 2px;font-weight:bold;}
.modal-close:hover{color:#d00;}
.modal-body{padding:12px;overflow-y:auto;flex:1;}
.modal-body label{display:block;font-weight:bold;margin-bottom:3px;font-size:9pt;color:#800000;}
.modal-body input,.modal-body textarea,.modal-body select{width:100%;border:1px solid #a9a9a9;padding:5px 8px;font-size:10pt;font-family:arial,sans-serif;outline:none;margin-bottom:10px;background:#fff;color:#000;max-width:100%;}
.modal-body input:focus,.modal-body textarea:focus{border-color:#e87020;}
.modal-foot{background:#f0e0d6;border-top:1px solid #d9bfb7;padding:7px 12px;display:flex;gap:6px;justify-content:flex-end;}
.modal-foot button{padding:3px 14px;font-size:10pt;cursor:pointer;}
#modal-ok{background:#98e;border:1px solid #7799cc;color:#000;font-weight:bold;}
#modal-ok:hover{background:#aaf;}
#modal-cancel{background:#f0e0d6;border:1px solid #d9bfb7;color:#800000;}
.modal-err{color:#d00;font-size:9pt;margin:-5px 0 8px;}
/* ── AUTH ── */
.auth-tabs{display:flex;margin-bottom:10px;}
.auth-tab{flex:1;padding:5px;border:1px solid #d9bfb7;background:#f0e0d6;color:#800;cursor:pointer;font-size:10pt;text-align:center;}
.auth-tab.on{background:#98e;border-color:#7799cc;color:#000;font-weight:bold;}
.auth-tab:not(.on):hover{background:#e8d0c0;}
.auth-inp{width:100%;border:1px solid #a9a9a9;padding:6px 9px;font-size:10pt;font-family:arial;outline:none;margin-bottom:8px;display:block;background:#fff;color:#000;max-width:100%;}
.auth-inp:focus{border-color:#e87020;}
.auth-sub{width:100%;padding:6px;background:#98e;border:1px solid #7799cc;cursor:pointer;font-size:11pt;font-weight:bold;margin-bottom:8px;}
.auth-sub:hover{background:#aaf;}
/* ── ADMIN ── */
.pend-card{border:1px solid #d9bfb7;background:#f0e0d6;padding:8px 12px;margin-bottom:8px;}
.pend-card h4{font-size:11pt;font-weight:bold;color:#d00;margin-bottom:3px;}
.pend-card .pm{font-size:9pt;color:#117743;margin-bottom:6px;}
.pend-actions{display:flex;gap:6px;flex-wrap:wrap;}
.btn-approve{padding:2px 10px;background:#4a7d44;color:#fff;border:none;cursor:pointer;font-size:9pt;}
.btn-approve:hover{background:#3a6234;}
.btn-reject{padding:2px 10px;background:#d00;color:#fff;border:none;cursor:pointer;font-size:9pt;}
.btn-reject:hover{background:#a00;}
/* ── TEMPLATE CARDS ── */
.tpl-card{border:1px solid #d9bfb7;background:#f0e0d6;padding:8px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;}
.tpl-card h4{font-size:10pt;font-weight:bold;color:#d00;margin-bottom:2px;}
.tpl-desc{font-size:9pt;color:#800;}
.tpl-acts{display:flex;flex-direction:column;gap:4px;flex-shrink:0;}
.btn-tpl{padding:2px 8px;font-size:9pt;cursor:pointer;border:1px solid #d9bfb7;background:#f0e0d6;color:#800000;}
.btn-tpl:hover{background:#e8d0c0;}
.btn-tpl.ins{background:#98e;border-color:#7799cc;color:#000;font-weight:bold;}
.btn-tpl.ins:hover{background:#aaf;}
.btn-tpl.del{background:#fff0f0;border-color:#ffa0a0;color:#d00;}
/* ── STATUS BAR ── */
#status-bar{position:fixed;bottom:0;left:0;right:0;background:#f0e0d6;border-top:1px solid #d9bfb7;padding:2px 10px;font-size:9pt;color:#800;z-index:800;display:flex;gap:12px;align-items:center;}
/* ── WIKI TABLE ── */
.wiki-table{border-collapse:collapse;width:100%;font-size:9pt;margin:6px 0;}
.wiki-table th,.wiki-table td{border:1px solid #aaa;padding:4px 8px;}
.wiki-table th{background:#f0e0d6;font-weight:bold;color:#800;}
/* ── RESPONSIVE ── */
@media(max-width:700px){
  #hamburger{display:flex;}
  #sidebar{position:fixed;left:0;top:24px;bottom:0;z-index:860;background:#ffe;width:175px;overflow-y:auto;transform:translateX(-100%);box-shadow:3px 0 12px rgba(0,0,0,.2);border-right:1px solid #d9bfb7;transition:transform .22s;}
  #layout{padding:8px 5px 60px;}
  .page-body{padding:10px 8px;}
  #search-wrap input{width:100px;}
}
@media(max-width:480px){
  .ph-actions{display:none;}
  .ed-loc{width:100%;}
}
</style>
</head>
<body>

<!-- TOP NAV -->
<nav id="topnav">
  <button id="hamburger" onclick="toggleSidebar()">☰</button>
  <strong onclick="goHome()">🌏 Bilinmeyen Dünya</strong>
  <span class="sep">—</span>
  <span>[</span><a onclick="goHome()">Ana Sayfa</a><span class="sep">/</span><a onclick="navigate('templates')">Şablonlar</a><span class="sep">/</span><a onclick="goRandom()">Rastgele</a><span>]</span>

      <button onclick="doSearch()">🔍</button>

</nav>

<div id="sb-overlay" onclick="closeSidebar()"></div>

<div id="layout">
  <aside id="sidebar">

    </div>
    <div class="sbox">
      <div class="sbox-head" style="display:flex;align-items:center;justify-content:space-between;">
        <span>🗃️ Görseller</span>
        <button onclick="openAddImageToSidebar()" style="background:none;border:none;cursor:pointer;color:#800;font-size:13px;padding:0 2px;font-weight:bold;" title="Görsel Ekle">+</button>
      </div>
      <div id="sb-images-list"><div style="padding:4px 8px;font-size:9pt;color:#a98;font-style:italic;">Henüz görsel yok</div></div>
    </div>
    <div class="sbox">
      <div class="sbox-head">İstatistik</div>
      <div class="sc" id="article-count">Yükleniyor…</div>
    </div>
    <div class="sbox">
      <div class="sbox-head">Hesap</div>
      <ul><li><a onclick="toggleUserMenu();closeSidebar()" id="sidebar-login-link">Giriş / Kayıt</a></li></ul>
    </div>
  </aside>
  <main id="main-content"></main>
</div>

<div id="status-bar">
  <span id="status-msg">Hazır</span>
  <span id="status-blocks"></span>
  <span style="margin-left:auto;font-size:8pt;">© 2026 Bilinmeyen Dünya</span>
</div>

<!-- MODAL -->
<div id="modal-overlay" class="modal-ov" style="display:none;" onclick="closeModalOutside(event)">
  <div class="modal-box">
    <div class="modal-head"><span id="modal-title">İşlem</span><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-footer"><button id="modal-cancel" onclick="closeModal()">İptal</button><button id="modal-ok" onclick="confirmModal()">Tamam</button></div>
  </div>
</div>

<!-- EMOJI PICKER -->
<div id="emoji-picker">
  <input type="text" id="emoji-search" placeholder="Emoji ara…" oninput="filterEmojis(this.value)">
  <div id="emoji-grid"></div>
</div>

/* ══ AUTH ══ */
const ADMIN_USER="sly",ADMIN_PASS="sevil177";
let currentUser=null;
function loadSession(){try{const s=localStorage.getItem("bbd_u");if(s)currentUser=JSON.parse(s);}catch(e){}updateUserPill();updateAdminNav();}
function saveSession(u){currentUser=u;localStorage.setItem("bbd_u",JSON.stringify(u));}
function clearSession(){currentUser=null;localStorage.removeItem("bbd_u");}
function isAdmin(){return currentUser&&currentUser.role==="admin";}
function isLoggedIn(){return!!currentUser;}

/* ══ IMAGES STORE (localStorage) ══ */
function getStoredImages(){try{return JSON.parse(localStorage.getItem("bbd_images")||"[]");}catch(e){return[];}}
function saveStoredImages(arr){localStorage.setItem("bbd_images",JSON.stringify(arr));}
function addStoredImage(name,dataUrl){const arr=getStoredImages();if(arr.find(i=>i.name===name)){alert("Bu isimde görsel zaten var.");return false;}arr.unshift({name,dataUrl,addedAt:Date.now()});saveStoredImages(arr);return true;}
function deleteStoredImage(name){saveStoredImages(getStoredImages().filter(i=>i.name!==name));renderSidebarImages();}
function getImageByName(name){return(getStoredImages().find(i=>i.name===name)||null);}
function renderSidebarImages(){
  const el=document.getElementById("sb-images-list");if(!el)return;
  const imgs=getStoredImages();
  if(!imgs.length){el.innerHTML=`<div style="padding:4px 8px;font-size:9pt;color:#a98;font-style:italic;">Henüz görsel yok</div>`;return;}
  el.innerHTML=imgs.map(img=>`<div style="display:flex;align-items:center;gap:3px;padding:2px 6px;border-bottom:1px solid #e8d0c0;">
    <img src="${escHtml(img.dataUrl)}" style="width:24px;height:24px;object-fit:cover;border:1px solid #d9bfb7;flex-shrink:0;">
    <span style="flex:1;font-size:8pt;color:#800;word-break:break-all;cursor:pointer;" onclick="insertStoredImageToCanvas('${escHtml(img.name)}')" title="Tıkla: editöre ekle">${escHtml(img.name)}</span>
    <button onclick="deleteStoredImage('${escHtml(img.name)}')" style="background:none;border:none;color:#d00;cursor:pointer;font-size:10px;padding:0 2px;flex-shrink:0;">✕</button>
  </div>`).join("");
}
function insertStoredImageToCanvas(name){
  const img=getImageByName(name);if(!img)return;
  const canvas=document.getElementById("editor-canvas-inner");if(!canvas){alert("Editörde açık değil.");return;}
  const pos=getSpawnPos();
  const block=createBlock("image",pos.x,pos.y);block.style.width="200px";block.style.height="150px";
  const inner=block.querySelector(".e-block-inner");inner.contentEditable=false;
  const imgEl=document.createElement("img");imgEl.src=img.dataUrl;imgEl.draggable=false;
  inner.appendChild(imgEl);canvas.appendChild(block);updateBlockCount();selectBlock(block);
}

function handleSbDrop(e){e.preventDefault();document.getElementById("sb-upload-drop").classList.remove("dragover");const f=e.dataTransfer.files[0];if(f&&f.type.startsWith("image/"))processSbFile(f);}
function handleSbFileSelect(e){const f=e.target.files[0];if(f)processSbFile(f);}
function processSbFile(file){
  const r=new FileReader();r.onload=ev=>{
    window._sbImgData=ev.target.result;
    const prev=document.getElementById("sb-upload-prev");prev.style.display="flex";
    document.getElementById("sb-thumb").src=ev.target.result;
    document.getElementById("sb-fname").textContent=file.name;
    const nameInp=document.getElementById("sb-img-name");if(nameInp&&!nameInp.value)nameInp.value=file.name;
  };r.readAsDataURL(file);
}
function clearSbUpload(){window._sbImgData=null;document.getElementById("sb-upload-prev").style.display="none";document.getElementById("sb-img-file").value="";}
function confirmAddSidebarImage(){
  const name=(document.getElementById("sb-img-name").value||"").trim();
  if(!name){alert("Görsel adı girin.");return;}
  if(!window._sbImgData){alert("Önce bir görsel seç.");return;}
  if(addStoredImage(name,window._sbImgData)){closeModal();renderSidebarImages();setStatus("Görsel eklendi: "+name);}
}

function showLoginModal(){
  document.getElementById("modal-title").textContent="Giriş Yap / Kayıt Ol";
  document.getElementById("modal-footer").style.display="none";
  document.getElementById("modal-body").innerHTML=`
    <div class="auth-tabs"><button class="auth-tab on" id="atab-login" onclick="switchAuthTab('login')">Giriş Yap</button><button class="auth-tab" id="atab-reg" onclick="switchAuthTab('reg')">Kayıt Ol</button></div>
    <div id="auth-err" class="modal-err" style="display:none"></div>
    <div id="auth-login">
      <input class="auth-inp" id="l-user" placeholder="Kullanıcı Adı" autocomplete="username">
      <input class="auth-inp" type="password" id="l-pass" placeholder="Şifre" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="auth-sub" onclick="doLogin()">Giriş Yap</button>
    </div>
    <div id="auth-reg" style="display:none">
      <input class="auth-inp" id="r-user" placeholder="Kullanıcı Adı (min 3)" autocomplete="off">
      <input class="auth-inp" type="password" id="r-pass" placeholder="Şifre (min 6)" onkeydown="if(event.key==='Enter')doRegister()">
      <button class="auth-sub" onclick="doRegister()">Kayıt Ol</button>
    </div>`;
  document.getElementById("modal-overlay").style.display="flex";
  setTimeout(()=>{const e=document.getElementById("l-user");if(e)e.focus();},60);
}
function switchAuthTab(tab){const isL=tab==="login";document.getElementById("auth-login").style.display=isL?"block":"none";document.getElementById("auth-reg").style.display=isL?"none":"block";document.getElementById("atab-login").className="auth-tab"+(isL?" on":"");document.getElementById("atab-reg").className="auth-tab"+(isL?"":" on");document.getElementById("auth-err").style.display="none";}
function authErr(msg){const e=document.getElementById("auth-err");if(e){e.textContent=msg;e.style.display="block";}}
function doLogin(){
  const u=(document.getElementById("l-user").value||"").trim(),p=(document.getElementById("l-pass").value||"").trim();
  if(!u||!p){authErr("Kullanıcı adı ve şifre gerekli.");return;}
  if(u===ADMIN_USER&&p===ADMIN_PASS){saveSession({username:u,role:"admin"});closeModal();updateUserPill();updateAdminNav();setStatus("Admin: "+u);return;}
  db.ref("users/"+u).once("value",snap=>{
    if(!snap.exists()){authErr("Kullanıcı bulunamadı.");return;}
    const d=snap.val();if(d.password!==p){authErr("Şifre yanlış.");return;}
    saveSession({username:u,role:d.role||"user"});closeModal();updateUserPill();updateAdminNav();setStatus("Giriş: "+u);
  });
}
function doRegister(){
  const u=(document.getElementById("r-user").value||"").trim(),p=(document.getElementById("r-pass").value||"").trim();
  if(u.length<3){authErr("Kullanıcı adı en az 3 karakter.");return;}
  if(p.length<6){authErr("Şifre en az 6 karakter.");return;}
  if(u===ADMIN_USER){authErr("Bu ad kullanılamaz.");return;}
  db.ref("users/"+u).once("value",snap=>{
    if(snap.exists()){authErr("Bu kullanıcı adı alınmış.");return;}
    db.ref("users/"+u).set({password:p,role:"user",createdAt:Date.now()},err=>{
      if(err){authErr("Hata: "+err.message);return;}
      saveSession({username:u,role:"user"});closeModal();updateUserPill();updateAdminNav();setStatus("Kayıt: "+u);
    });
  });
}

/* ══ ROUTER ══ */
window.addEventListener("hashchange",router);
function navigate(p){location.hash="#"+p;}
function goHome(){navigate("");}
function openEditor(){navigate("editor");}
function goRandom(){db.ref("articles").once("value",snap=>{const data=snap.val();if(!data){setStatus("Hiç sayfa yok.");return;}const vals=Object.values(data);navigate("article/"+vals[Math.floor(Math.random()*vals.length)].slug);});}
function router(){closeEmojiPicker();const hash=location.hash.replace(/^#\/?/,"");if(hash.startsWith("article/"))loadArticle(hash.split("/")[1]);else if(hash.startsWith("editor/"))renderEditor(hash.split("/")[1]);else if(hash==="editor")renderEditor(null);else if(hash==="admin")renderAdmin();else if(hash==="templates")renderTemplates();else renderHome();}

/* ══ UTILS ══ */
function slugify(t){return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ş/g,"s").replace(/ı/g,"i").replace(/ö/g,"o").replace(/ç/g,"c").replace(/\s+/g,"-").replace(/[^\w\-]+/g,"").replace(/--+/g,"-").substring(0,80);}
function setStatus(m){document.getElementById("status-msg").textContent=m;}
function setStatusBlocks(m){document.getElementById("status-blocks").textContent=m;}
function escHtml(s){if(typeof s!=="string")return"";return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function stripTags(s){return(s||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();}
function fmtSize(b){if(b<1024)return b+"B";if(b<1048576)return(b/1024).toFixed(1)+"KB";return(b/1048576).toFixed(1)+"MB";}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("mob-open");document.getElementById("sb-overlay").classList.toggle("on");}
function closeSidebar(){document.getElementById("sidebar").classList.remove("mob-open");document.getElementById("sb-overlay").classList.remove("on");}

/* ══ TEMPLATE ENGINE ══ */
function renderTemplate(html,args){return html.replace(/\{\{\{([^}|]+)(?:\|([^}]*))?\}\}\}/g,(m,name,def)=>{name=name.trim();if(args&&args[name]!==undefined)return args[name];return def!==undefined?def:"";});}
function resolveImageSrcs(html){/* replace bare image filenames in src with stored dataUrl */return html.replace(/src="([^"]+)"/g,(match,src)=>{if(src.startsWith("data:")||src.startsWith("http")||src.startsWith("//"))return match;const img=getImageByName(src);return img?`src="${img.dataUrl}"`:match;});}
function renderTemplateTags(html,templates){html=resolveImageSrcs(html);return html.replace(/\{\{([^}|#]+?)(\|[^}]*)?\}\}/g,(match,name,argsStr)=>{name=name.trim();const tpl=templates.find(t=>t.name===name||t.slug===slugify(name));if(!tpl)return match;const args={};if(argsStr){const parts=argsStr.slice(1).split("|");parts.forEach((p,i)=>{const eq=p.indexOf("=");if(eq>0){args[p.slice(0,eq).trim()]=p.slice(eq+1);}else{args[i+1]=p;args[i]=p;}});}return`<span class="tpl-render">${renderTemplate(tpl.html,args)}</span>`;});}
async function loadAllTemplates(){return new Promise(resolve=>{db.ref("templates").once("value",snap=>{const stored=snap.val()?Object.values(snap.val()):[];const map={};BUILTIN_TEMPLATES.forEach(t=>map[t.slug]=t);stored.forEach(t=>map[t.slug]=t);resolve(Object.values(map));});});}
function seedTemplates(){db.ref("templates").once("value",snap=>{BUILTIN_TEMPLATES.forEach(tpl=>{if(!snap.child(tpl.slug).exists())db.ref("templates/"+tpl.slug).set(tpl);});});}

  document.getElementById("main-content").innerHTML=`
    <div class="page-wrap">
      <div class="page-head"><div class="ph-tabs"><span class="ph-tab active">🏠 Ana Sayfa</span></div><div class="ph-actions"><a onclick="openEditor()">+ Yeni Sayfa</a></div></div>
      <div class="page-body">
        <div class="notice">🌏 <b>Bilinmeyen Dünya</b>'ya hoş geldiniz — anonim açık Türkçe arşiv.</div>
        <p class="art-title" style="font-size:13pt;margin-bottom:8px;">Tüm Sayfalar</p>
        <div id="article-list"><div class="empty-state">Yükleniyor…</div></div>
      </div>
    </div>`;

    listEl.innerHTML=arr.map(a=>{const tb=(a.blocks||[]).find(b=>b.type==="text");const ex=tb?stripTags(tb.content).substring(0,130):"";return`<div class="acard"><div class="acard-title"><a onclick="navigate('article/${a.slug}')">${escHtml(a.title)}</a></div><div class="acard-meta">📍${escHtml(a.location||"Anonim")} &bull; ${new Date(a.createdAt).toLocaleString("tr-TR")}${a.author?" &bull; ✍️"+escHtml(a.author):""}</div>${ex?`<div class="acard-excerpt">${escHtml(ex)}…</div>`:""}</div>`;}).join("");
  });
}

/* ══ ARTICLE VIEW ══ */
async function loadArticle(slug){
  setStatus("Yükleniyor…");
  const [snap,templates]=await Promise.all([db.ref("articles/"+slug).once("value"),loadAllTemplates()]);
  if(!snap.exists()){document.getElementById("main-content").innerHTML=`<div class="page-wrap"><div class="page-body"><div class="notice warn">⚠️ Bu sayfa mevcut değil.</div><button class="btn-post" onclick="openEditor()">Sayfa Oluştur</button></div></div>`;setStatus("404");return;}
  const a=snap.val();
  document.title=a.title+" — Bilinmeyen Dünya";setStatus("Yüklendi: "+a.title);
  const ch=computeCanvasH(a.blocks||[]);
  const bHtml=(a.blocks||[]).map(b=>{const w=b.width?`width:${b.width};`:"",h=b.height?`height:${b.height};`:"";if(b.type==="text")return`<div class="view-block" style="left:${b.left};top:${b.top};${w}${h}">${renderTemplateTags(b.content,templates)}</div>`;return`<div class="view-block" style="left:${b.left};top:${b.top};${w}${h}"><img src="${escHtml(b.content)}" alt=""></div>`;}).join("");
  document.getElementById("main-content").innerHTML=`
    <div class="page-wrap">
      <div class="page-head"><div class="ph-tabs"><span class="ph-tab active">📄 Sayfa</span><span class="ph-tab" onclick="navigate('editor/${slug}')">✏️ Düzenle</span></div><div class="ph-actions"><a onclick="navigate('editor/${slug}')">✏️ Düzenle</a><a class="red" onclick="deleteArticle('${slug}')">🗑️ Sil</a></div></div>
      <div class="page-body">
        <div class="art-title">${escHtml(a.title)}</div>
        <div class="art-meta"><span>📍 ${escHtml(a.location||"Anonim")}</span><span>📅 ${new Date(a.createdAt).toLocaleString("tr-TR")}</span>${a.author?`<span>✍️ ${escHtml(a.author)}</span>`:""}</div>
        <div class="viewer-canvas" style="min-height:${ch}px;">${bHtml}</div>
      </div>
    </div>`;
}
function computeCanvasH(blocks){let max=300;blocks.forEach(b=>{max=Math.max(max,(parseInt(b.top)||0)+(parseInt(b.height)||150)+50);});return max;}
function deleteArticle(slug){showConfirmModal("Bu sayfayı sil?",()=>{db.ref("articles/"+slug).remove(()=>goHome());});}

/* ══ TEMPLATES PAGE ══ */
async function renderTemplates(){
  document.title="Şablonlar — Bilinmeyen Dünya";setStatus("Şablonlar");
  const templates=await loadAllTemplates();const isAdm=isAdmin();
  document.getElementById("main-content").innerHTML=`
    <div class="page-wrap">
      <div class="page-head"><div class="ph-tabs"><span class="ph-tab active">📋 Şablonlar</span></div><div class="ph-actions">${isAdm?`<a onclick="openTemplateEditor(null)">+ Yeni Şablon</a>`:""}<a onclick="goHome()">Ana Sayfa</a></div></div>
      <div class="page-body">
        <div class="notice">Şablonlar: <code style="background:#f0e0d6;padding:1px 4px;border:1px solid #d9bfb7;">{{ŞablonAdı|parametre=değer}}</code> şeklinde kullanılır.</div>
        <p class="art-title" style="font-size:12pt;margin:10px 0 8px;">Mevcut Şablonlar</p>
        <div id="tpl-list">${renderTplCards(templates,isAdm)}</div>
      </div>
    </div>`;
}
function renderTplCards(templates,isAdm){
  if(!templates.length)return`<div class="empty-state">Henüz şablon yok.</div>`;
  return templates.map(t=>`<div class="tpl-card"><div style="flex:1;"><h4>📋 ${escHtml(t.name)} <span style="font-size:8pt;font-weight:normal;font-family:monospace;">{{${escHtml(t.name)}}}</span></h4><div class="tpl-desc">${escHtml(t.desc||"")}</div></div><div class="tpl-acts"><button class="btn-tpl ins" onclick="previewTemplate('${t.slug}')">👁 Önizle</button>${isAdm?`<button class="btn-tpl" onclick="openTemplateEditor('${t.slug}')">✏️ Düzenle</button><button class="btn-tpl del" onclick="deleteTemplate('${t.slug}')">🗑️ Sil</button>`:""}</div></div>`).join("");
}

    if(!nameEl||!htmlEl){alert("Form hatası.");return false;}

function insertTemplateIntoEditor(slug){
  loadAllTemplates().then(templates=>{
    const t=templates.find(t=>t.slug===slug);if(!t)return;closeModal();
    const params=[];const rx=/\{\{\{([^}|]+)(?:\|([^}]*))?\}\}\}/g;let m;
    while((m=rx.exec(t.html))!==null){if(!params.find(p=>p.name===m[1].trim()))params.push({name:m[1].trim(),def:m[2]||""});}
    if(!params.length){const inner=getActiveInner();if(inner){inner.focus();document.execCommand('insertHTML',false,`{{${t.name}}}`);}return;}
    showInputModal(`📋 ${t.name}`,params.map(p=>({id:"tpl_"+p.name,label:p.name+(p.def?" (varsayılan: "+p.def+")":"")+":",placeholder:p.def,type:"text"})),vals=>{
      let tag=`{{${t.name}`;params.forEach(p=>{tag+=`|${p.name}=${vals["tpl_"+p.name]||p.def}`;});tag+=`}}`;
      const inner=getActiveInner();if(inner){inner.focus();document.execCommand('insertHTML',false,tag);}
    });
  });
}

/* FORMAT */
function fmt(cmd){ensureFocus();document.execCommand(cmd,false,null);}
function applyColor(cmd,val){ensureFocus();document.execCommand(cmd,false,val);}
function applyFontSize(val){
  if(!val)return;ensureFocus();
  const pxMap={"1":"9px","2":"11px","3":"13px","4":"16px","5":"20px","6":"26px","7":"36px"};
  const px=pxMap[val]||val;
  document.execCommand('fontSize',false,'7');/* trick: apply size7 first to create font tags */
  const inner=getActiveInner();if(!inner)return;
  inner.querySelectorAll('font[size="7"]').forEach(f=>{f.removeAttribute('size');f.style.fontSize=px;});
}
function applyFontFamily(val){if(!val)return;ensureFocus();document.execCommand('fontName',false,val);}
function applyHeading(val){ensureFocus();document.execCommand('formatBlock',false,val||'p');}
function ensureFocus(){const inner=getActiveInner();if(inner&&!inner.contains(document.activeElement))inner.focus();}
function getActiveInner(){if(activeInner)return activeInner;if(selectedBlock)return selectedBlock.querySelector(".e-block-inner");return null;}
function edUndo(){document.execCommand('undo',false,null);}
function edRedo(){document.execCommand('redo',false,null);}

function insertTable(){showInputModal("⊞ Tablo Ekle",[{id:"tr",label:"Satır:",placeholder:"3",type:"number"},{id:"tc",label:"Sütun:",placeholder:"3",type:"number"}],vals=>{const rows=parseInt(vals.tr)||3,cols=parseInt(vals.tc)||3;let html='<table class="wiki-table">';for(let r=0;r<rows;r++){html+='<tr>';for(let c=0;c<cols;c++)html+=`<td>${r===0?`<b>Başlık ${c+1}</b>`:"Hücre"}</td>`;html+='</tr>';}html+='</table>';const inner=getActiveInner();if(inner){inner.focus();document.execCommand('insertHTML',false,html);}else addTextBlock(html);});}

function loadBlock(b){const canvas=document.getElementById("editor-canvas-inner");if(!canvas)return;const block=createBlock(b.type,parseInt(b.left)||10,parseInt(b.top)||10);if(b.width)block.style.width=b.width;if(b.height)block.style.height=b.height;const inner=block.querySelector(".e-block-inner");if(b.type==="image"){inner.contentEditable=false;const img=document.createElement("img");img.src=b.content;img.draggable=false;inner.appendChild(img);}else inner.innerHTML=b.content||"";canvas.appendChild(block);updateBlockCount();}

    <div style="display:flex;margin-bottom:10px;">
      <button id="imgtab-file" onclick="switchImgTab('file')" style="flex:1;padding:4px;background:#98e;border:1px solid #7799cc;cursor:pointer;font-weight:bold;font-size:9pt;color:#000;">📁 Dosyadan Yükle</button>
      <button id="imgtab-url" onclick="switchImgTab('url')" style="flex:1;padding:4px;background:#f0e0d6;border:1px solid #d9bfb7;border-left:none;cursor:pointer;font-size:9pt;color:#800;">🔗 URL ile</button>
    </div>
    <!-- FILE TAB -->
    <div id="img-tab-file">
      <label class="img-up-wrap" id="upload-drop" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
        <input type="file" id="img-file-input" accept="image/*" onchange="handleFileSelect(event)">
        <div style="font-size:26px;">🖼️</div>
        <div>Resmi buraya <b>sürükle</b> veya <u>tıklayarak seç</u></div>
        <div style="font-size:8pt;margin-top:4px;color:#888;">PNG, JPG, GIF, WEBP &bull; 1MB altı önerilir</div>
      </label>
      <div class="upload-prev" id="upload-preview">
        <div style="width:56px;height:56px;border:1px solid #d9bfb7;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff;flex-shrink:0;">
          <img id="upload-thumb-img" style="max-width:56px;max-height:56px;object-fit:contain;display:block;">
        </div>
        <div class="up-meta">
          <div class="up-name" id="upload-fname"></div>
          <div class="up-size" id="upload-fsize"></div>
          <div class="up-warn" id="upload-warn"></div>
        </div>
        <button class="upload-clear" onclick="clearUpload()">✕</button>
      </div>
      <div style="display:flex;gap:6px;margin-top:8px;">
        <button onclick="confirmFileUpload()" style="flex:1;padding:4px;background:#98e;border:1px solid #7799cc;cursor:pointer;font-weight:bold;font-size:10pt;" id="btn-upload-confirm" disabled>✅ Resmi Ekle</button>
        <button onclick="closeModal()" style="padding:4px 12px;background:#f0e0d6;border:1px solid #d9bfb7;cursor:pointer;font-size:10pt;">İptal</button>
      </div>
    </div>
    <!-- URL TAB -->
    <div id="img-tab-url" style="display:none;">
      <label>Resim URL'si:</label>
      <input type="text" id="img-url" placeholder="https://i.imgur.com/xxxxx.jpg">
      <div style="border:1px solid #d9bfb7;min-height:70px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;background:#fffef0;" id="img-url-preview"><span style="color:#888;font-style:italic;font-size:9pt;">URL gir → önizleme</span></div>
      <div style="display:flex;gap:6px;">
        <button onclick="confirmImgUrl()" style="flex:1;padding:4px;background:#98e;border:1px solid #7799cc;cursor:pointer;font-weight:bold;font-size:10pt;">✅ Ekle</button>
        <button onclick="closeModal()" style="padding:4px 12px;background:#f0e0d6;border:1px solid #d9bfb7;cursor:pointer;font-size:10pt;">İptal</button>
      </div>
    </div>`;
  // URL preview
  const urlInput=document.getElementById("img-url");const urlPreview=document.getElementById("img-url-preview");
  urlInput.addEventListener("input",()=>{const u=urlInput.value.trim();if(!u){urlPreview.innerHTML=`<span style="color:#888;font-style:italic;font-size:9pt;">URL gir → önizleme</span>`;return;}urlPreview.innerHTML=`<img src="${escHtml(u)}" onerror="this.parentElement.innerHTML='<span style=\\'color:#d00;font-size:9pt;\\'>❌ Yüklenemedi</span>'" style="max-width:100%;max-height:140px;object-fit:contain;">`;});
  urlInput.addEventListener("keydown",e=>{if(e.key==="Enter")confirmImgUrl();});
  window._imgCb=cb;window._imgData=null;
  document.getElementById("modal-overlay").style.display="flex";
}
function switchImgTab(tab){
  const isFile=tab==="file";
  document.getElementById("img-tab-file").style.display=isFile?"block":"none";
  document.getElementById("img-tab-url").style.display=isFile?"none":"block";
  document.getElementById("imgtab-file").style.background=isFile?"#98e":"#f0e0d6";document.getElementById("imgtab-file").style.color=isFile?"#000":"#800";document.getElementById("imgtab-file").style.borderColor=isFile?"#7799cc":"#d9bfb7";
  document.getElementById("imgtab-url").style.background=isFile?"#f0e0d6":"#98e";document.getElementById("imgtab-url").style.color=isFile?"#800":"#000";document.getElementById("imgtab-url").style.borderColor=isFile?"#d9bfb7":"#7799cc";
}
function handleDragOver(e){e.preventDefault();document.getElementById("upload-drop").classList.add("dragover");}
function handleDragLeave(){document.getElementById("upload-drop").classList.remove("dragover");}
function handleDrop(e){e.preventDefault();document.getElementById("upload-drop").classList.remove("dragover");const file=e.dataTransfer.files[0];if(file&&file.type.startsWith("image/"))processImageFile(file);}
function handleFileSelect(e){const file=e.target.files[0];if(file)processImageFile(file);}
function processImageFile(file){
  const reader=new FileReader();
  reader.onload=function(ev){
    const dataUrl=ev.target.result;window._imgData=dataUrl;
    document.getElementById("upload-preview").classList.add("on");
    document.getElementById("upload-thumb-img").src=dataUrl;
    document.getElementById("upload-fname").textContent=file.name;
    document.getElementById("upload-fsize").textContent=fmtSize(file.size);
    const warn=document.getElementById("upload-warn");
    if(file.size>800*1024){warn.style.display="block";warn.textContent="⚠️ Büyük dosya ("+fmtSize(file.size)+") — Firebase'de sorun çıkabilir";}
    else warn.style.display="none";
    const btn=document.getElementById("btn-upload-confirm");if(btn)btn.disabled=false;
  };
  reader.readAsDataURL(file);
}
function clearUpload(){window._imgData=null;document.getElementById("upload-preview").classList.remove("on");document.getElementById("upload-thumb-img").src="";document.getElementById("upload-fname").textContent="";document.getElementById("upload-fsize").textContent="";document.getElementById("upload-warn").style.display="none";document.getElementById("img-file-input").value="";const btn=document.getElementById("btn-upload-confirm");if(btn)btn.disabled=true;}
function confirmFileUpload(){if(!window._imgData){alert("Önce bir dosya seç.");return;}closeModal();if(window._imgCb){window._imgCb(window._imgData);window._imgCb=null;window._imgData=null;}}
function confirmImgUrl(){const url=(document.getElementById("img-url").value||"").trim();if(!url){alert("Lütfen bir URL girin.");return;}closeModal();if(window._imgCb){window._imgCb(url);window._imgCb=null;}}

function createBlock(type,left,top){
  const block=document.createElement("div");block.className="e-block";block.dataset.type=type;block.id="block-"+(blockIdCounter++);block.style.left=left+"px";block.style.top=top+"px";
  const inner=document.createElement("div");inner.className="e-block-inner";if(type==="text"){inner.contentEditable=true;inner.spellcheck=true;inner.addEventListener("focus",()=>{activeInner=inner;});}
  block.appendChild(inner);
  ["nw","n","ne","e","se","s","sw","w"].forEach(d=>{const h=document.createElement("div");h.className=`rh rh-${d}`;block.appendChild(h);makeResizable(block,h,d);makeTouchResizable(block,h,d);});
  const del=document.createElement("button");del.className="block-del";del.innerHTML="✕";del.addEventListener("mousedown",e=>{e.stopPropagation();e.preventDefault();});del.addEventListener("click",e=>{e.stopPropagation();if(selectedBlock===block){selectedBlock=null;activeInner=null;}block.remove();updateBlockCount();});block.appendChild(del);
  /* MOUSE DRAG */
  block.addEventListener("mousedown",e=>{
    if(e.target.classList.contains("rh")||e.target.classList.contains("block-del"))return;
    if(type==="text"&&block.classList.contains("selected")&&inner.contains(e.target))return;
    selectBlock(block);const sx=e.clientX,sy=e.clientY,origL=parseInt(block.style.left)||0,origT=parseInt(block.style.top)||0;let dragging=false;e.preventDefault();
    function onMove(mv){const dx=mv.clientX-sx,dy=mv.clientY-sy;if(!dragging&&(Math.abs(dx)>4||Math.abs(dy)>4)){dragging=true;block.style.opacity=".8";block.style.zIndex="99";}if(dragging){block.style.left=Math.max(0,origL+dx)+"px";block.style.top=Math.max(0,origT+dy)+"px";setStatus(`X:${Math.max(0,origL+dx).toFixed(0)} Y:${Math.max(0,origT+dy).toFixed(0)}`);updateBlockCount();}}
    function onUp(){document.removeEventListener("mousemove",onMove);document.removeEventListener("mouseup",onUp);block.style.opacity="";block.style.zIndex="";if(!dragging&&type==="text"){inner.focus();activeInner=inner;}dragging=false;}
    document.addEventListener("mousemove",onMove);document.addEventListener("mouseup",onUp);
  });
  /* TOUCH DRAG — only drag when NOT already selected (first tap = select, second drag = move) */
  let touchSelectTime=0;
  block.addEventListener("touchstart",e=>{
    if(e.target.classList.contains("rh")||e.target.classList.contains("block-del"))return;
    const alreadySelected=block.classList.contains("selected");
    selectBlock(block);
    if(!alreadySelected){touchSelectTime=Date.now();return;} /* first touch just selects */
    const t0=e.touches[0],sx=t0.clientX,sy=t0.clientY,origL=parseInt(block.style.left)||0,origT=parseInt(block.style.top)||0;let dragging=false;
    function onMove(mv){const t=mv.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(!dragging&&(Math.abs(dx)>6||Math.abs(dy)>6)){dragging=true;block.style.opacity=".8";block.style.zIndex="99";}if(dragging){mv.preventDefault();block.style.left=Math.max(0,origL+dx)+"px";block.style.top=Math.max(0,origT+dy)+"px";updateBlockCount();}}
    function onEnd(){block.removeEventListener("touchmove",onMove);block.removeEventListener("touchend",onEnd);block.style.opacity="";block.style.zIndex="";}
    block.addEventListener("touchmove",onMove,{passive:false});block.addEventListener("touchend",onEnd);
  },{passive:true});
  return block;
}
function selectBlock(block){if(selectedBlock&&selectedBlock!==block)selectedBlock.classList.remove("selected");selectedBlock=block;block.classList.add("selected");}
function deselectAll(){if(selectedBlock){selectedBlock.classList.remove("selected");selectedBlock=null;}}
function selectAllContent(el){const r=document.createRange();r.selectNodeContents(el);const s=window.getSelection();s.removeAllRanges();s.addRange(r);}
function makeResizable(block,handle,dir){handle.addEventListener("mousedown",e=>{e.preventDefault();e.stopPropagation();const sx=e.clientX,sy=e.clientY,sw=block.offsetWidth,sh=block.offsetHeight,sl=parseInt(block.style.left)||0,st=parseInt(block.style.top)||0;function onMove(mv){const dx=mv.clientX-sx,dy=mv.clientY-sy;let w=sw,h=sh,l=sl,t=st;if(dir.includes("e"))w=Math.max(60,sw+dx);if(dir.includes("s"))h=Math.max(24,sh+dy);if(dir.includes("w")){w=Math.max(60,sw-dx);l=sl+(sw-w);}if(dir.includes("n")){h=Math.max(24,sh-dy);t=st+(sh-h);}block.style.width=w+"px";block.style.height=h+"px";block.style.left=l+"px";block.style.top=t+"px";updateBlockCount();}function onUp(){document.removeEventListener("mousemove",onMove);document.removeEventListener("mouseup",onUp);}document.addEventListener("mousemove",onMove);document.addEventListener("mouseup",onUp);});}
function makeTouchResizable(block,handle,dir){handle.addEventListener("touchstart",e=>{e.stopPropagation();e.preventDefault();const t0=e.touches[0],sx=t0.clientX,sy=t0.clientY,sw=block.offsetWidth,sh=block.offsetHeight,sl=parseInt(block.style.left)||0,st=parseInt(block.style.top)||0;function onMove(mv){mv.preventDefault();const t=mv.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;let w=sw,h=sh,l=sl,tt=st;if(dir.includes("e"))w=Math.max(60,sw+dx);if(dir.includes("s"))h=Math.max(24,sh+dy);if(dir.includes("w")){w=Math.max(60,sw-dx);l=sl+(sw-w);}if(dir.includes("n")){h=Math.max(24,sh-dy);tt=st+(sh-h);}block.style.width=w+"px";block.style.height=h+"px";block.style.left=l+"px";block.style.top=tt+"px";updateBlockCount();}function onEnd(){document.removeEventListener("touchmove",onMove);document.removeEventListener("touchend",onEnd);}document.addEventListener("touchmove",onMove,{passive:false});document.addEventListener("touchend",onEnd);},{passive:false});}
function changeCanvasSize(){showInputModal("⤢ Tuval Boyutu",[{id:"cvw",label:"Genişlik (px):",placeholder:"900",type:"number"},{id:"cvh",label:"Yükseklik (px):",placeholder:"600",type:"number"}],vals=>{const inner=document.getElementById("editor-canvas-inner");if(inner){if(vals.cvw)inner.style.minWidth=(parseInt(vals.cvw)||900)+"px";if(vals.cvh)inner.style.minHeight=(parseInt(vals.cvh)||600)+"px";}});}
function clearCanvas(){showConfirmModal("Tüm blokları sil?",()=>{document.getElementById("editor-canvas-inner").querySelectorAll(".e-block").forEach(b=>b.remove());selectedBlock=null;activeInner=null;updateBlockCount();});}

/* ══ SAVE ══ */
function saveArticle(){
  const title=(document.getElementById("ed-title").value||"").trim(),location=(document.getElementById("ed-location").value||"").trim();
  if(!title){alert("Lütfen bir başlık girin.");document.getElementById("ed-title").focus();return;}
  const canvas=document.getElementById("editor-canvas-inner"),blocks=[];
  canvas.querySelectorAll(".e-block").forEach(block=>{const type=block.dataset.type,inner=block.querySelector(".e-block-inner");let content;if(type==="image"){const img=inner.querySelector("img");content=img?img.src:"";}else content=inner.innerHTML;blocks.push({type,left:block.style.left,top:block.style.top,width:block.style.width||null,height:block.style.height||null,content});});
  const slug=editingSlug||slugify(title),payload={title,location,slug,blocks,createdAt:Date.now(),author:currentUser?currentUser.username:"Anonim"};
  setStatus("Kaydediliyor…");
  if(isAdmin()){db.ref("articles/"+slug).set(payload,err=>{if(err){alert("Hata: "+err.message);setStatus("Hata!");return;}setStatus("Kaydedildi ✅");navigate("article/"+slug);});}
  else{db.ref("pending/"+slug+"_"+Date.now()).set(payload,err=>{if(err){alert("Hata: "+err.message);setStatus("Hata!");return;}setStatus("Onaya gönderildi ✅");document.getElementById("main-content").innerHTML=`<div class="page-wrap"><div class="page-body"><div class="notice success">✅ İçeriğiniz admin onayına gönderildi!</div><button class="btn-post" onclick="goHome()" style="margin-top:10px">🏠 Ana Sayfaya Dön</button></div></div>`;});}
}

/* ══ MODAL ══ */
let modalCb=null;
function closeModal(){document.getElementById("modal-overlay").style.display="none";document.getElementById("modal-footer").style.display="flex";modalCb=null;window._tplModalCb=null;}
function closeModalOutside(e){if(e.target.id==="modal-overlay")closeModal();}
function confirmModal(){if(window._tplModalCb){if(window._tplModalCb()!==false)closeModal();return;}if(typeof modalCb==="function"){const inputs=document.querySelectorAll("#modal-body input[data-id],#modal-body textarea[data-id]");if(inputs.length){const v={};inputs.forEach(i=>v[i.dataset.id]=i.value);modalCb(v);}else modalCb();}closeModal();}
function showConfirmModal(msg,cb){modalCb=cb;document.getElementById("modal-title").textContent="Onayla";document.getElementById("modal-body").innerHTML=`<p>${escHtml(msg)}</p>`;document.getElementById("modal-ok").textContent="Evet";document.getElementById("modal-cancel").textContent="Hayır";document.getElementById("modal-footer").style.display="flex";document.getElementById("modal-overlay").style.display="flex";}
function showInputModal(title,fields,cb){modalCb=cb;document.getElementById("modal-title").textContent=title;document.getElementById("modal-body").innerHTML=fields.map(f=>`<label>${escHtml(f.label)}</label><input type="${f.type||'text'}" data-id="${f.id}" placeholder="${escHtml(f.placeholder||'')}">`).join("");document.getElementById("modal-ok").textContent="Tamam";document.getElementById("modal-cancel").textContent="İptal";document.getElementById("modal-footer").style.display="flex";document.getElementById("modal-overlay").style.display="flex";setTimeout(()=>{const fi=document.querySelector("#modal-body input");if(fi)fi.focus();},50);}

/* ══ SEARCH ══ */
function doSearch(){const q=(document.getElementById("search-input").value||"").trim().toLowerCase();if(!q)return;_runSearch(q);}
function doSidebarSearch(){const q=(document.getElementById("sb-search-input").value||"").trim().toLowerCase();if(!q)return;closeSidebar();_runSearch(q);}
function _runSearch(q){setStatus("Aranıyor: "+q);db.ref("articles").once("value",snap=>{const data=snap.val();const el=document.getElementById("main-content");if(!data){el.innerHTML=`<div class="page-wrap"><div class="page-body"><div class="notice warn">Sonuç bulunamadı.</div></div></div>`;return;}const res=Object.values(data).filter(a=>a.title.toLowerCase().includes(q)||(a.blocks||[]).some(b=>b.type==="text"&&stripTags(b.content).toLowerCase().includes(q)));document.title=`"${q}" — Bilinmeyen Dünya`;el.innerHTML=`<div class="page-wrap"><div class="page-head"><div class="ph-tabs"><span class="ph-tab active">🔍 Arama</span></div></div><div class="page-body"><p class="art-title" style="font-size:12pt;">Arama: "${escHtml(q)}"</p><p style="font-size:9pt;color:#117743;margin-bottom:10px;">${res.length} sonuç</p>${res.length?res.map(a=>`<div class="acard"><div class="acard-title"><a onclick="navigate('article/${a.slug}')">${escHtml(a.title)}</a></div><div class="acard-meta">📍 ${escHtml(a.location||"Anonim")} &bull; ${new Date(a.createdAt).toLocaleDateString("tr-TR")}</div></div>`).join(""):'<div class="empty-state">Sonuç bulunamadı.</div>'}</div></div>`;setStatus(res.length+" sonuç");});}

/* ══ KEYBOARD ══ */
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();closeEmojiPicker();}if((e.ctrlKey||e.metaKey)&&e.key==="s"){e.preventDefault();if(document.getElementById("ed-title"))saveArticle();}});

/* ══ LIVE COUNT ══ */
db.ref("articles").on("value",snap=>{const n=snap.val()?Object.keys(snap.val()).length:0;const el=document.getElementById("article-count");if(el)el.textContent=n+" sayfa";});

/* ══ INIT ══ */
loadSession();seedTemplates();renderSidebarImages();router();
</script>
