<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bilinmeyen Dünya</title>
<link href="https://fonts.googleapis.com/css2?family=Linux+Libertine+Display&family=Linux+Libertine&family=Linux+Biolinum&display=swap" rel="stylesheet">
<style>
/* ══ ROOT ══ */
:root{
  --bg:#f6f7f8;--white:#ffffff;--border:#a7d7f9;--link:#2a5bd6;
  --text:#1a1a1a;--muted:#72777d;--toolbar-bg:#eaf3fb;--toolbar-border:#a2a9b1;
  --header-h:54px;--sidebar-w:200px;
  --accent:#2a5bd6;--danger:#cc2222;--success:#1a7f4a;
  --shadow:0 2px 8px rgba(0,0,0,.10);
  --radius:3px;
  --font-body:'Linux Libertine',Georgia,serif;
  --font-ui:'Linux Biolinum',system-ui,sans-serif;
  --font-display:'Linux Libertine Display',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);font-size:15px;line-height:1.65;-webkit-tap-highlight-color:transparent;}

/* ══ SCROLLBAR ══ */
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#c0c8d8;border-radius:3px;}

/* ══ HEADER ══ */
#site-header{
  background:linear-gradient(135deg,#1a2a6c 0%,#253e9e 60%,#2a5bd6 100%);
  border-bottom:2px solid rgba(255,255,255,.12);
  position:sticky;top:0;z-index:900;
  box-shadow:0 2px 12px rgba(0,0,0,.25);
}
#header-inner{
  display:flex;align-items:center;max-width:1440px;margin:0 auto;
  padding:0 14px;height:var(--header-h);gap:10px;
}
#hamburger{
  display:none;background:none;border:none;cursor:pointer;
  padding:6px;color:#fff;font-size:20px;flex-shrink:0;
}
#site-logo{
  font-family:var(--font-display);font-size:22px;color:#fff;
  cursor:pointer;white-space:nowrap;letter-spacing:-.3px;
  text-shadow:0 1px 3px rgba(0,0,0,.4);
  display:flex;align-items:center;gap:7px;flex-shrink:0;
}
#site-logo .logo-dot{color:#f7c800;}
#site-tagline{font-size:10px;color:rgba(255,255,255,.6);font-style:italic;white-space:nowrap;display:none;}
#header-search{
  flex:1;max-width:320px;margin-left:auto;
  display:flex;border:1px solid rgba(255,255,255,.25);border-radius:18px;
  overflow:hidden;background:rgba(255,255,255,.12);
  transition:background .2s;
}
#header-search:focus-within{background:rgba(255,255,255,.22);}
#search-input{
  padding:6px 12px;border:none;outline:none;font-size:13px;
  font-family:var(--font-ui);width:100%;background:transparent;color:#fff;
}
#search-input::placeholder{color:rgba(255,255,255,.55);}
#search-input::-webkit-search-cancel-button{display:none;}
#header-search button{
  padding:6px 12px;border:none;background:transparent;cursor:pointer;
  color:rgba(255,255,255,.7);font-size:15px;
}
#header-nav{display:flex;gap:5px;align-items:center;flex-shrink:0;}
.nav-btn{
  padding:5px 11px;font-size:12.5px;font-family:var(--font-ui);
  border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.10);
  color:#fff;cursor:pointer;border-radius:14px;white-space:nowrap;
  transition:background .15s;
}
.nav-btn:hover{background:rgba(255,255,255,.22);}
.nav-btn.primary{background:rgba(247,200,0,.85);border-color:rgba(247,200,0,.5);color:#1a1a00;font-weight:bold;}
.nav-btn.primary:hover{background:#f7c800;}
.nav-btn.tpl{background:rgba(90,200,150,.2);border-color:rgba(90,200,150,.4);color:#afffda;}
.nav-btn.tpl:hover{background:rgba(90,200,150,.35);}
#user-pill{
  font-size:12px;padding:4px 11px;border-radius:14px;cursor:pointer;
  white-space:nowrap;font-family:var(--font-ui);border:1px solid rgba(255,255,255,.25);
  color:#fff;background:rgba(255,255,255,.10);transition:background .15s;
}
#user-pill:hover{background:rgba(255,255,255,.22);}
#user-pill.admin-pill{background:rgba(247,200,0,.2);border-color:rgba(247,200,0,.5);color:#f7c800;}

/* ══ LAYOUT ══ */
#layout{max-width:1440px;margin:0 auto;padding:18px 14px 70px;display:flex;gap:18px;}
#sidebar{width:var(--sidebar-w);flex-shrink:0;transition:transform .25s;}
.sidebar-box{background:#fff;border:1px solid var(--border);margin-bottom:10px;border-radius:var(--radius);box-shadow:var(--shadow);}
.sidebar-box h3{
  background:linear-gradient(90deg,#eaf3fb,#f4f8fd);
  border-bottom:1px solid var(--border);padding:6px 10px;
  font-size:10.5px;font-family:var(--font-ui);font-weight:700;
  color:#2a5bd6;text-transform:uppercase;letter-spacing:.7px;
  border-radius:var(--radius) var(--radius) 0 0;
}
.sidebar-box ul{list-style:none;padding:4px 0;}
.sidebar-box ul li a{
  display:flex;align-items:center;gap:5px;padding:4px 10px;
  color:var(--link);text-decoration:none;cursor:pointer;font-size:13px;
  transition:background .1s;
}
.sidebar-box ul li a:hover{background:#f0f6ff;text-decoration:none;}
.sidebar-count{padding:6px 10px;color:var(--muted);font-style:italic;font-size:12px;}

/* Mobile sidebar overlay */
#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:850;}
#sidebar-overlay.on{display:block;}
#sidebar.mobile-open{transform:translateX(0)!important;}

/* ══ MAIN ══ */
#main-content{flex:1;min-width:0;}

/* ══ PAGE WRAP ══ */
.page-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.page-tabs{
  display:flex;border-bottom:1px solid var(--border);
  background:linear-gradient(90deg,#f4f8fd,#eaf3fb);
  padding:7px 10px 0;gap:2px;overflow-x:auto;flex-wrap:nowrap;
}
.page-tabs::-webkit-scrollbar{height:0;}
.page-tab{
  padding:6px 14px;font-size:13px;font-family:var(--font-ui);
  border:1px solid transparent;border-bottom:none;background:transparent;
  cursor:pointer;border-radius:var(--radius) var(--radius) 0 0;
  color:var(--link);white-space:nowrap;position:relative;bottom:-1px;
  transition:background .1s;user-select:none;
}
.page-tab:hover{background:rgba(42,91,214,.07);}
.page-tab.active{
  background:#fff;border:1px solid var(--border);border-bottom:1px solid #fff;
  color:var(--text);font-weight:bold;
}
.page-actions{margin-left:auto;display:flex;align-items:flex-end;padding-bottom:5px;gap:6px;flex-shrink:0;}
.page-action-link{font-size:12px;color:var(--link);cursor:pointer;padding:2px 5px;white-space:nowrap;font-family:var(--font-ui);}
.page-action-link:hover{text-decoration:underline;}
.page-action-link.red{color:var(--danger);}
.page-body{padding:18px 20px;}

/* ══ ARTICLE ══ */
.article-title-h1{
  font-family:var(--font-display);font-size:28px;font-weight:normal;
  border-bottom:1px solid #e0eaf5;padding-bottom:5px;margin-bottom:13px;
  color:#1a1a2e;
}
.article-meta{font-size:12px;color:var(--muted);margin-bottom:14px;font-style:italic;display:flex;flex-wrap:wrap;gap:6px;}
.article-meta span{display:flex;align-items:center;gap:3px;}

/* ══ VIEWER ══ */
.viewer-canvas{position:relative;background:#fff;overflow:auto;}
.view-block{position:absolute;overflow:visible;font-family:var(--font-body);font-size:15px;line-height:1.65;}
.view-block img{max-width:100%;height:100%;display:block;object-fit:contain;border:1px solid #e8e8e8;border-radius:2px;}

/* Template rendering */
.tpl-render{margin:6px 0;}
.tpl-render table{border-collapse:collapse;}

/* ══ ARTICLE LIST ══ */
.article-card{border-bottom:1px solid #f0f3f7;padding:12px 0;transition:background .1s;}
.article-card:last-child{border-bottom:none;}
.article-card:hover{background:#fafcff;}
.article-card-title{font-family:var(--font-display);font-size:19px;font-weight:normal;}
.article-card-title a{color:var(--link);text-decoration:none;cursor:pointer;}
.article-card-title a:hover{text-decoration:underline;}
.article-card-meta{font-size:11.5px;color:var(--muted);margin-top:2px;font-style:italic;}
.article-card-excerpt{font-size:13px;color:#555;margin-top:4px;line-height:1.5;}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);font-style:italic;}

/* ══ NOTICE ══ */
.notice{
  border-left:3px solid var(--accent);background:#eaf3fb;
  padding:9px 13px;margin-bottom:12px;font-size:13px;color:#1d4391;
  font-family:var(--font-ui);border-radius:0 var(--radius) var(--radius) 0;
}
.notice.warn{border-color:#d08000;background:#fff8e8;color:#7a4a00;}
.notice.success{border-color:var(--success);background:#edfaf3;color:#0f5132;}
.notice.danger{border-color:var(--danger);background:#fff0f0;color:#8b0000;}

/* ══ EDITOR ══ */
.editor-wrap{padding:14px;}
.editor-title-input{
  font-family:var(--font-display);font-size:24px;width:100%;border:none;
  border-bottom:2px solid var(--border);padding:5px 0;margin-bottom:10px;
  outline:none;color:var(--text);background:transparent;
  transition:border-color .2s;
}
.editor-title-input:focus{border-color:var(--accent);}
.editor-title-input::placeholder{color:#bbb;}
.editor-meta-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.editor-loc-input{
  font-family:var(--font-ui);font-size:13px;flex:1;min-width:160px;
  border:1px solid var(--toolbar-border);padding:5px 9px;outline:none;
  color:var(--muted);border-radius:var(--radius);background:#fafafa;
}
.editor-loc-input:focus{border-color:var(--accent);background:#fff;}

/* ══ TOOLBAR ══ */
.wiki-toolbar{
  background:linear-gradient(90deg,var(--toolbar-bg),#f0f6fd);
  border:1px solid var(--toolbar-border);border-bottom:none;
  padding:3px 5px;display:flex;flex-wrap:wrap;gap:1px;align-items:center;
  border-radius:var(--radius) var(--radius) 0 0;
  overflow-x:auto;
}
.wiki-toolbar::-webkit-scrollbar{height:0;}
.toolbar-group{display:flex;gap:1px;border-right:1px solid #c8d0db;padding-right:4px;margin-right:3px;flex-shrink:0;}
.toolbar-group:last-child{border-right:none;}
.tb{
  padding:4px 7px;font-size:12.5px;font-family:var(--font-ui);
  border:1px solid transparent;background:transparent;cursor:pointer;
  border-radius:3px;color:var(--text);white-space:nowrap;
  min-width:24px;text-align:center;line-height:1.4;
  transition:background .1s,border-color .1s;flex-shrink:0;
}
.tb:hover{background:#d8eaf8;border-color:#7aaad8;}
.tb:active{background:#b8d8f0;}
select.tb-select{
  padding:3px 5px;font-size:12px;font-family:var(--font-ui);
  border:1px solid var(--toolbar-border);background:white;
  cursor:pointer;border-radius:var(--radius);max-width:85px;
}
.tb-color-wrap{display:flex;align-items:center;gap:2px;}
.tb-color-label{font-size:10px;color:var(--muted);font-family:var(--font-ui);}
input.tb-color{width:28px;height:24px;border:1px solid var(--toolbar-border);padding:1px;cursor:pointer;border-radius:3px;}

/* ══ EDITOR CANVAS ══ */
.editor-canvas{
  border:1px solid var(--toolbar-border);min-height:560px;position:relative;
  background:
    linear-gradient(rgba(42,91,214,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(42,91,214,.04) 1px,transparent 1px),
    #fff;
  background-size:30px 30px;
  overflow:hidden;cursor:default;touch-action:none;
}
.editor-canvas-hint{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  color:#c8d4e8;font-size:14px;font-style:italic;
  pointer-events:none;user-select:none;gap:8px;
}
.editor-canvas-hint .hint-icon{font-size:36px;opacity:.4;}

/* ══ BLOCKS ══ */
.e-block{position:absolute;border:1px dashed transparent;cursor:move;min-width:60px;min-height:28px;}
.e-block:hover{border-color:#88aade !important;}
.e-block.selected{border:1.5px solid #3679d8 !important;box-shadow:0 0 0 3px rgba(54,121,216,.15);}
.e-block-inner{
  width:100%;height:100%;outline:none;font-family:var(--font-body);
  font-size:15px;line-height:1.65;color:var(--text);
  overflow:auto;padding:5px 7px;word-break:break-word;
}
.e-block-inner:focus{cursor:text;}
.e-block img{max-width:100%;height:100%;display:block;pointer-events:none;object-fit:contain;}
.e-block-type-badge{
  position:absolute;top:-17px;left:0;font-size:9px;font-family:var(--font-ui);
  color:#fff;background:#3679d8;padding:1px 5px;border-radius:2px 2px 0 0;
  opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap;
}
.e-block.selected .e-block-type-badge{opacity:1;}

/* ══ RESIZE HANDLES ══ */
.rh{width:9px;height:9px;background:#3679d8;border:1.5px solid white;position:absolute;border-radius:2px;z-index:10;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.rh-se{right:-5px;bottom:-5px;cursor:se-resize;}
.rh-sw{left:-5px;bottom:-5px;cursor:sw-resize;}
.rh-ne{right:-5px;top:-5px;cursor:ne-resize;}
.rh-nw{left:-5px;top:-5px;cursor:nw-resize;}
.rh-n{left:50%;top:-5px;transform:translateX(-50%);cursor:n-resize;}
.rh-s{left:50%;bottom:-5px;transform:translateX(-50%);cursor:s-resize;}
.rh-e{right:-5px;top:50%;transform:translateY(-50%);cursor:e-resize;}
.rh-w{left:-5px;top:50%;transform:translateY(-50%);cursor:w-resize;}
.block-delete{
  position:absolute;top:-10px;right:-10px;width:18px;height:18px;
  background:var(--danger);color:white;border:1.5px solid white;
  border-radius:50%;cursor:pointer;font-size:10px;
  display:flex;align-items:center;justify-content:center;z-index:20;
  box-shadow:0 1px 4px rgba(0,0,0,.3);transition:background .1s;
}
.block-delete:hover{background:#a01515;}

.editor-bottombar{
  background:linear-gradient(90deg,#f4f8fd,#eaf3fb);
  border:1px solid var(--toolbar-border);border-top:none;
  padding:7px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  border-radius:0 0 var(--radius) var(--radius);
}
.btn-save{
  padding:7px 20px;background:linear-gradient(135deg,#2a5bd6,#1e40a8);
  color:white;border:1px solid #1a3d9e;cursor:pointer;
  font-family:var(--font-ui);font-size:14px;border-radius:var(--radius);
  box-shadow:0 2px 6px rgba(42,91,214,.3);transition:all .15s;
}
.btn-save:hover{background:linear-gradient(135deg,#1e40a8,#152d7a);box-shadow:0 3px 10px rgba(42,91,214,.4);}
.btn-cancel{
  padding:7px 14px;background:linear-gradient(135deg,#f8f9fa,#eaecf0);
  border:1px solid var(--toolbar-border);cursor:pointer;
  font-family:var(--font-ui);font-size:14px;border-radius:var(--radius);
}
.btn-cancel:hover{background:#e0e4ea;}

/* ══ EMOJI PICKER ══ */
#emoji-picker{
  position:fixed;z-index:800;background:white;border:1px solid var(--border);
  box-shadow:0 6px 24px rgba(0,0,0,.18);padding:8px;display:none;
  width:300px;border-radius:8px;
}
#emoji-picker input{
  width:100%;border:1px solid var(--toolbar-border);padding:5px 9px;
  font-size:13px;margin-bottom:7px;outline:none;border-radius:var(--radius);
}
#emoji-picker input:focus{border-color:var(--accent);}
#emoji-grid{display:flex;flex-wrap:wrap;gap:1px;max-height:190px;overflow-y:auto;}
#emoji-grid span{font-size:22px;cursor:pointer;padding:3px;border-radius:4px;line-height:1;display:inline-block;transition:background .1s;}
#emoji-grid span:hover{background:#eaf3fb;}

/* ══ MODAL ══ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(2px);
}
.modal-box{
  background:white;border:1px solid var(--border);width:520px;max-width:96vw;
  box-shadow:0 8px 40px rgba(0,0,0,.25);border-radius:6px;
  max-height:90vh;display:flex;flex-direction:column;
}
.modal-header{
  background:linear-gradient(90deg,#eaf3fb,#f4f8fd);
  border-bottom:1px solid var(--border);padding:11px 16px;
  display:flex;align-items:center;justify-content:space-between;
  font-family:var(--font-ui);font-weight:bold;font-size:14px;color:#2a5bd6;
  border-radius:6px 6px 0 0;flex-shrink:0;
}
.modal-close{background:none;border:none;cursor:pointer;font-size:18px;color:#888;padding:0 3px;line-height:1;}
.modal-close:hover{color:var(--danger);}
.modal-body{padding:16px;overflow-y:auto;flex:1;}
.modal-body label{display:block;font-weight:bold;margin-bottom:4px;font-family:var(--font-ui);font-size:13px;color:#333;}
.modal-body input,.modal-body textarea,.modal-body select{
  width:100%;border:1px solid var(--toolbar-border);padding:8px 10px;
  font-size:14px;font-family:inherit;outline:none;margin-bottom:12px;
  border-radius:var(--radius);transition:border-color .15s;
}
.modal-body input:focus,.modal-body textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(42,91,214,.12);}
.modal-preview{
  border:1px solid #e0e8f0;min-height:80px;display:flex;align-items:center;
  justify-content:center;margin-bottom:12px;background:#fafafa;overflow:hidden;border-radius:var(--radius);
}
.modal-preview img{max-width:100%;max-height:210px;object-fit:contain;}
.no-preview{color:#aaa;font-style:italic;font-size:13px;}
.modal-footer{
  background:#f8f9fa;border-top:1px solid #eaecf0;padding:10px 16px;
  display:flex;gap:8px;justify-content:flex-end;border-radius:0 0 6px 6px;flex-shrink:0;
}
.modal-footer button{padding:7px 16px;font-family:var(--font-ui);font-size:13px;cursor:pointer;border-radius:var(--radius);}
#modal-ok{background:linear-gradient(135deg,#2a5bd6,#1e40a8);color:white;border:1px solid #1a3d9e;}
#modal-ok:hover{background:linear-gradient(135deg,#1e40a8,#152d7a);}
#modal-cancel{background:linear-gradient(135deg,#f8f9fa,#eaecf0);border:1px solid var(--toolbar-border);color:var(--text);}
.modal-err{color:var(--danger);font-size:12px;margin:-7px 0 9px;font-family:var(--font-ui);}

/* ══ STATUS BAR ══ */
#status-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:linear-gradient(90deg,#eaf3fb,#f0f6fd);
  border-top:1px solid var(--border);padding:4px 14px;
  font-size:11px;color:var(--muted);font-family:var(--font-ui);
  z-index:800;display:flex;gap:16px;align-items:center;
}

/* ══ ADMIN ══ */
.pending-card{border:1px solid #e8b000;background:linear-gradient(135deg,#fffbe6,#fff8d6);padding:11px 14px;margin-bottom:10px;border-radius:var(--radius);}
.pending-card h4{font-family:var(--font-display);font-size:17px;font-weight:normal;margin-bottom:3px;}
.pending-card .pm{font-size:12px;color:var(--muted);margin-bottom:8px;}
.pending-actions{display:flex;gap:7px;flex-wrap:wrap;}
.btn-approve{padding:5px 13px;background:linear-gradient(135deg,#1a7f4a,#0f5132);color:white;border:none;cursor:pointer;border-radius:var(--radius);font-size:13px;font-family:var(--font-ui);}
.btn-approve:hover{background:linear-gradient(135deg,#0f5132,#0a3622);}
.btn-reject{padding:5px 13px;background:linear-gradient(135deg,#cc2222,#8b0000);color:white;border:none;cursor:pointer;border-radius:var(--radius);font-size:13px;font-family:var(--font-ui);}
.btn-reject:hover{background:linear-gradient(135deg,#8b0000,#6a0000);}
.pending-badge{display:inline-block;background:var(--danger);color:white;border-radius:10px;padding:1px 7px;font-size:10px;margin-left:4px;vertical-align:middle;}

/* ══ TEMPLATE CARDS ══ */
.tpl-card{
  border:1px solid #d0ddf0;background:linear-gradient(135deg,#f8fbff,#eef4ff);
  padding:12px 14px;margin-bottom:10px;border-radius:var(--radius);
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
}
.tpl-card-info h4{font-family:var(--font-display);font-size:17px;font-weight:normal;color:#1a2a5e;}
.tpl-card-info .tpl-desc{font-size:12px;color:var(--muted);margin-top:2px;}
.tpl-card-actions{display:flex;gap:6px;flex-shrink:0;}
.btn-tpl{padding:4px 11px;font-size:12px;font-family:var(--font-ui);cursor:pointer;border-radius:var(--radius);}
.btn-tpl-edit{background:#eaf3fb;border:1px solid var(--border);color:var(--link);}
.btn-tpl-edit:hover{background:#d8ecff;}
.btn-tpl-del{background:#fff0f0;border:1px solid #ffa0a0;color:var(--danger);}
.btn-tpl-del:hover{background:#ffe0e0;}
.btn-tpl-ins{background:linear-gradient(135deg,#2a5bd6,#1e40a8);border:none;color:#fff;}

function doLogin(){

  const p=(document.getElementById("l-pass").value||"").trim();
  if(!u||!p){authErr("Kullanıcı adı ve şifre gerekli.");return;}
  if(u===ADMIN_USER&&p===ADMIN_PASS){
    saveSession({username:u,role:"admin"});closeModal();updateUserPill();updateAdminNav();
    setStatus("Admin girişi: "+u);return;
  }
  db.ref("users/"+u).once("value",snap=>{
    if(!snap.exists()){authErr("Kullanıcı bulunamadı.");return;}
    const d=snap.val();
    if(d.password!==p){authErr("Şifre yanlış.");return;}
    saveSession({username:u,role:d.role||"user"});closeModal();updateUserPill();updateAdminNav();
    setStatus("Giriş yapıldı: "+u);
  });
}
function doRegister(){
  const u=(document.getElementById("r-user").value||"").trim();
  const p=(document.getElementById("r-pass").value||"").trim();
  if(u.length<3){authErr("Kullanıcı adı en az 3 karakter.");return;}
  if(p.length<6){authErr("Şifre en az 6 karakter.");return;}
  if(u===ADMIN_USER){authErr("Bu ad kullanılamaz.");return;}
  db.ref("users/"+u).once("value",snap=>{
    if(snap.exists()){authErr("Bu kullanıcı adı alınmış.");return;}
    db.ref("users/"+u).set({password:p,role:"user",createdAt:Date.now()},err=>{
      if(err){authErr("Hata: "+err.message);return;}
      saveSession({username:u,role:"user"});closeModal();updateUserPill();updateAdminNav();
      setStatus("Kayıt olundu: "+u);
    });
  });
}

/* ══════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════ */
function slugify(t){
  return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ş/g,"s")
    .replace(/ı/g,"i").replace(/ö/g,"o").replace(/ç/g,"c")
    .replace(/\s+/g,"-").replace(/[^\w\-]+/g,"").replace(/--+/g,"-").substring(0,80);
}
function setStatus(m){document.getElementById("status-msg").textContent=m;}
function setStatusBlocks(m){document.getElementById("status-blocks").textContent=m;}
function escHtml(s){if(typeof s!=="string")return"";return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function stripTags(s){return(s||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();}

/* ══════════════════════════════════════════════
   TEMPLATE ENGINE
══════════════════════════════════════════════ */
/* Parse {{{param|default}}} and replace with provided args */
function renderTemplate(html, args){
  // args is an object like {0:"val1", içerik:"...", ...} or array
  return html.replace(/\{\{\{([^}|]+)(?:\|([^}]*))?\}\}\}/g,(m,name,def)=>{
    name=name.trim();
    if(args&&args[name]!==undefined) return args[name];
    if(args&&args[0]!==undefined&&/^\d+$/.test(name)) return args[name]||def||"";
    return def!==undefined?def:"";
  });
}

/* Render {{TemplateName|arg1|arg2|key=val}} tags inside HTML string */
function renderTemplateTags(html, templates){
  return html.replace(/\{\{([^}|]+)(\|[^}]*)?\}\}/g,(match,name,argsStr)=>{
    name=name.trim();
    const tpl=templates.find(t=>t.name===name||t.slug===slugify(name));
    if(!tpl) return match; // keep as-is if not found
    const args={};
    if(argsStr){
      const parts=argsStr.slice(1).split("|");
      parts.forEach((p,i)=>{
        const eq=p.indexOf("=");
        if(eq>0){args[p.slice(0,eq).trim()]=p.slice(eq+1);}
        else{args[i+1]=p;args[i]=p;}
      });
    }
    return `<span class="tpl-render">${renderTemplate(tpl.html,args)}</span>`;
  });
}

/* Load all templates (builtins + firebase) */
async function loadAllTemplates(){
  return new Promise(resolve=>{
    db.ref("templates").once("value",snap=>{
      const stored=snap.val()?Object.values(snap.val()):[];
      // Merge: stored overrides builtins by slug
      const map={};
      BUILTIN_TEMPLATES.forEach(t=>map[t.slug]=t);
      stored.forEach(t=>map[t.slug]=t);
      resolve(Object.values(map));
    });
  });
}

/* Seed built-in templates to Firebase if not present */
function seedTemplates(){
  db.ref("templates").once("value",snap=>{
    BUILTIN_TEMPLATES.forEach(tpl=>{
      if(!snap.child(tpl.slug).exists()){
        db.ref("templates/"+tpl.slug).set(tpl);
      }
    });
  });
}

        <div id="article-list"><div class="empty-state">⏳ Yükleniyor…</div></div>

    </div>`;
  db.ref("articles").once("value",snap=>{

    if(!data){
      listEl.innerHTML=`<div class="empty-state">📭 Henüz hiçbir sayfa yok.<br><br><button class="btn-save" onclick="openEditor()">İlk Sayfayı Oluştur</button></div>`;
      if(cEl)cEl.textContent="0 sayfa";return;

    const arr=Object.values(data).sort((a,b)=>b.createdAt-a.createdAt);
    if(cEl)cEl.textContent=arr.length+" sayfa";
    listEl.innerHTML=arr.map(a=>{
      const tb=(a.blocks||[]).find(b=>b.type==="text");
      const ex=tb?stripTags(tb.content).substring(0,130):"";
      const d=new Date(a.createdAt).toLocaleDateString("tr-TR");
      return `<div class="article-card" style="padding:12px 0;">

        ${ex?`<div class="article-card-excerpt">${escHtml(ex)}…</div>`:""}
      </div>`;
    }).join("");
  });
}

async function loadArticle(slug){
  setStatus("Yükleniyor…");
  const [snap,templates]=await Promise.all([
    db.ref("articles/"+slug).once("value"),
    loadAllTemplates()
  ]);
  if(!snap.exists()){
    document.getElementById("main-content").innerHTML=`<div class="page-wrap"><div class="page-body"><div class="notice warn">⚠️ Bu sayfa mevcut değil.</div><button class="btn-save" onclick="openEditor()">Sayfa Oluştur</button></div></div>`;
    setStatus("404");return;
  }
  const a=snap.val();
  document.title=a.title+" — Bilinmeyen Dünya";
  setStatus("Yüklendi: "+a.title);
  const canvasH=computeCanvasH(a.blocks||[]);
  const bHtml=(a.blocks||[]).map(b=>{
    const w=b.width?`width:${b.width};`:"",h=b.height?`height:${b.height};`:"";
    if(b.type==="text"){
      const rendered=renderTemplateTags(b.content,templates);
      return `<div class="view-block" style="left:${b.left};top:${b.top};${w}${h}">${rendered}</div>`;
    }
    return `<div class="view-block" style="left:${b.left};top:${b.top};${w}${h}"><img src="${escHtml(b.content)}" alt=""></div>`;
  }).join("");
  const d=new Date(a.createdAt).toLocaleString("tr-TR");
  document.getElementById("main-content").innerHTML=`
    <div class="page-wrap">
      <div class="page-tabs">
        <span class="page-tab active">📄 Sayfa</span>
        <span class="page-tab" onclick="navigate('editor/${slug}')">✏️ Düzenle</span>
        <div class="page-actions">
          <a class="page-action-link" onclick="navigate('editor/${slug}')">✏️ Düzenle</a>
          <a class="page-action-link red" onclick="deleteArticle('${slug}')">🗑️ Sil</a>
        </div>
      </div>
      <div class="page-body">
        <h1 class="article-title-h1">${escHtml(a.title)}</h1>
        <div class="article-meta">
          <span>📍 ${escHtml(a.location||"Anonim")}</span>
          <span>🕐 ${d}</span>
          ${a.author?`<span>✍️ ${escHtml(a.author)}</span>`:""}
        </div>
        <div class="viewer-canvas" style="min-height:${canvasH}px;">${bHtml}</div>
      </div>
    </div>`;
}
function computeCanvasH(blocks){
  let max=350;
  blocks.forEach(b=>{max=Math.max(max,(parseInt(b.top)||0)+(parseInt(b.height)||150)+50);});
  return max;
}
function deleteArticle(slug){
  showConfirmModal("Bu sayfayı silmek istediğine emin misin?",()=>{
    db.ref("articles/"+slug).remove(()=>goHome());
  });
}

function previewTemplate(slug){

    const t=templates.find(t=>t.slug===slug);
    if(!t)return;
    document.getElementById("modal-title").textContent="👁 Önizle: "+t.name;
    document.getElementById("modal-body").innerHTML=`<div style="padding:8px;">${renderTemplate(t.html,{})}</div>`;
    document.getElementById("modal-footer").style.display="none";
    document.getElementById("modal-overlay").style.display="flex";
  });

/* Insert template into active editor block */
function insertTemplateIntoEditor(slug){
  loadAllTemplates().then(templates=>{
    const t=templates.find(t=>t.slug===slug);
    if(!t)return;
    closeModal();
    // Extract param names
    const params=[];
    const rx=/\{\{\{([^}|]+)(?:\|([^}]*))?\}\}\}/g;
    let m;
    while((m=rx.exec(t.html))!==null){
      if(!params.find(p=>p.name===m[1].trim()))
        params.push({name:m[1].trim(),def:m[2]||""});
    }
    if(params.length===0){
      // No params — insert directly
      const inner=getActiveInner();
      if(inner){inner.focus();document.execCommand('insertHTML',false,`{{${t.name}}}`);}
      return;
    }
    // Prompt for params
    showInputModal(`📋 ${t.name} — Parametreler`,
      params.map(p=>({id:"tpl_"+p.name,label:p.name+(p.def?" (varsayılan: "+p.def+")":"")+":",placeholder:p.def,type:"text"})),
      vals=>{
        let tag=`{{${t.name}`;
        params.forEach(p=>{ tag+=`|${p.name}=${vals["tpl_"+p.name]||p.def}`; });
        tag+=`}}`;
        const inner=getActiveInner();
        if(inner){inner.focus();document.execCommand('insertHTML',false,tag);}
      });
  });
}

}
function getActiveInner(){

}

function insertTable(){
  showInputModal("⊞ Tablo Ekle",[
    {id:"tr",label:"Satır:",placeholder:"3",type:"number"},
    {id:"tc",label:"Sütun:",placeholder:"3",type:"number"}
  ],vals=>{
    const rows=parseInt(vals.tr)||3,cols=parseInt(vals.tc)||3;
    let html='<table class="wiki-table">';
    for(let r=0;r<rows;r++){
      html+='<tr>';
      for(let c=0;c<cols;c++) html+=`<td>${r===0?`<b>Başlık ${c+1}</b>`:"Hücre"}</td>`;

    }
    html+='</table>';
    const inner=getActiveInner();

  });
}

function loadBlock(b){
  const canvas=document.getElementById("editor-canvas");if(!canvas)return;
  const block=createBlock(b.type,parseInt(b.left)||10,parseInt(b.top)||10);
  if(b.width)block.style.width=b.width;

    inner.appendChild(img);

function createBlock(type,left,top){
  const block=document.createElement("div");
  block.className="e-block";
  block.dataset.type=type;
  block.id="block-"+(blockIdCounter++);
  block.style.left=left+"px";
  block.style.top=top+"px";

  // Type badge
  const badge=document.createElement("div");
  badge.className="e-block-type-badge";
  badge.textContent=type==="image"?"🖼️ Resim":"📝 Metin";
  block.appendChild(badge);

  const inner=document.createElement("div");
  inner.className="e-block-inner";
  if(type==="text"){
    inner.contentEditable=true;inner.spellcheck=true;
    inner.addEventListener("focus",()=>{activeInner=inner;});
  }
  block.appendChild(inner);

  // Resize handles
  ["nw","n","ne","e","se","s","sw","w"].forEach(d=>{
    const h=document.createElement("div");h.className=`rh rh-${d}`;block.appendChild(h);
    makeResizable(block,h,d);
    makeTouchResizable(block,h,d);
  });

  // Delete
  const del=document.createElement("button");
  del.className="block-delete";del.innerHTML="✕";
  del.addEventListener("mousedown",e=>{e.stopPropagation();e.preventDefault();});
  del.addEventListener("click",e=>{
    e.stopPropagation();
    if(selectedBlock===block){selectedBlock=null;activeInner=null;}
    block.remove();updateBlockCount();
  });
  block.appendChild(del);

  /* ── MOUSE DRAG ── */
  block.addEventListener("mousedown",e=>{
    if(e.target.classList.contains("rh")||e.target.classList.contains("block-delete"))return;
    if(type==="text"&&block.classList.contains("selected")&&inner.contains(e.target))return;
    selectBlock(block);
    const startX=e.clientX,startY=e.clientY;
    const origL=parseInt(block.style.left)||0,origT=parseInt(block.style.top)||0;
    let dragging=false;
    e.preventDefault();
    function onMove(mv){
      const dx=mv.clientX-startX,dy=mv.clientY-startY;
      if(!dragging&&(Math.abs(dx)>4||Math.abs(dy)>4)){dragging=true;block.style.opacity=".82";block.style.zIndex="99";}
      if(dragging){
        block.style.left=Math.max(0,origL+dx)+"px";
        block.style.top=Math.max(0,origT+dy)+"px";
        setStatus(`X:${Math.max(0,origL+dx).toFixed(0)} Y:${Math.max(0,origT+dy).toFixed(0)}`);
      }
    }
    function onUp(){
      document.removeEventListener("mousemove",onMove);document.removeEventListener("mouseup",onUp);
      block.style.opacity="";block.style.zIndex="";
      if(!dragging&&type==="text"){inner.focus();activeInner=inner;}
      dragging=false;
    }
    document.addEventListener("mousemove",onMove);document.addEventListener("mouseup",onUp);
  });

  /* ── TOUCH DRAG ── */
  block.addEventListener("touchstart",e=>{
    if(e.target.classList.contains("rh")||e.target.classList.contains("block-delete"))return;
    const t0=e.touches[0];
    selectBlock(block);
    const startX=t0.clientX,startY=t0.clientY;
    const origL=parseInt(block.style.left)||0,origT=parseInt(block.style.top)||0;
    let dragging=false;
    function onMove(mv){
      const t=mv.touches[0];
      const dx=t.clientX-startX,dy=t.clientY-startY;
      if(!dragging&&(Math.abs(dx)>6||Math.abs(dy)>6)){dragging=true;block.style.opacity=".82";block.style.zIndex="99";}
      if(dragging){
        mv.preventDefault();
        block.style.left=Math.max(0,origL+dx)+"px";
        block.style.top=Math.max(0,origT+dy)+"px";
      }
    }
    function onEnd(){
      block.removeEventListener("touchmove",onMove);block.removeEventListener("touchend",onEnd);
      block.style.opacity="";block.style.zIndex="";dragging=false;
    }
    block.addEventListener("touchmove",onMove,{passive:false});
    block.addEventListener("touchend",onEnd);
  },{passive:true});

  return block;
}

function selectBlock(block){
  if(selectedBlock&&selectedBlock!==block)selectedBlock.classList.remove("selected");
  selectedBlock=block;block.classList.add("selected");
}
function deselectAll(){
  if(selectedBlock){selectedBlock.classList.remove("selected");selectedBlock=null;}
}
function selectAllContent(el){
  const r=document.createRange();r.selectNodeContents(el);
  const s=window.getSelection();s.removeAllRanges();s.addRange(r);
}

/* ══ RESIZE — MOUSE ══ */
function makeResizable(block,handle,dir){
  handle.addEventListener("mousedown",e=>{
    e.preventDefault();e.stopPropagation();
    const sx=e.clientX,sy=e.clientY,sw=block.offsetWidth,sh=block.offsetHeight;
    const sl=parseInt(block.style.left)||0,st=parseInt(block.style.top)||0;
    function onMove(mv){
      const dx=mv.clientX-sx,dy=mv.clientY-sy;
      let w=sw,h=sh,l=sl,t=st;
      if(dir.includes("e"))w=Math.max(60,sw+dx);
      if(dir.includes("s"))h=Math.max(28,sh+dy);
      if(dir.includes("w")){w=Math.max(60,sw-dx);l=sl+(sw-w);}
      if(dir.includes("n")){h=Math.max(28,sh-dy);t=st+(sh-h);}
      block.style.width=w+"px";block.style.height=h+"px";
      block.style.left=l+"px";block.style.top=t+"px";
    }
    function onUp(){document.removeEventListener("mousemove",onMove);document.removeEventListener("mouseup",onUp);}
    document.addEventListener("mousemove",onMove);document.addEventListener("mouseup",onUp);
  });
}

/* ══ RESIZE — TOUCH ══ */
function makeTouchResizable(block,handle,dir){
  handle.addEventListener("touchstart",e=>{
    e.stopPropagation();e.preventDefault();
    const t0=e.touches[0],sx=t0.clientX,sy=t0.clientY;
    const sw=block.offsetWidth,sh=block.offsetHeight;
    const sl=parseInt(block.style.left)||0,st=parseInt(block.style.top)||0;
    function onMove(mv){
      mv.preventDefault();
      const t=mv.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;
      let w=sw,h=sh,l=sl,tt=st;
      if(dir.includes("e"))w=Math.max(60,sw+dx);
      if(dir.includes("s"))h=Math.max(28,sh+dy);
      if(dir.includes("w")){w=Math.max(60,sw-dx);l=sl+(sw-w);}
      if(dir.includes("n")){h=Math.max(28,sh-dy);tt=st+(sh-h);}
      block.style.width=w+"px";block.style.height=h+"px";
      block.style.left=l+"px";block.style.top=tt+"px";
    }
    function onEnd(){
      document.removeEventListener("touchmove",onMove);document.removeEventListener("touchend",onEnd);
    }
    document.addEventListener("touchmove",onMove,{passive:false});
    document.addEventListener("touchend",onEnd);
  },{passive:false});
}

/* ══ SAVE ══ */
function saveArticle(){
  const title=(document.getElementById("ed-title").value||"").trim();
  const location=(document.getElementById("ed-location").value||"").trim();
  if(!title){alert("Lütfen bir başlık girin.");document.getElementById("ed-title").focus();return;}
  const canvas=document.getElementById("editor-canvas");
  const blocks=[];
  canvas.querySelectorAll(".e-block").forEach(block=>{
    const type=block.dataset.type;
    const inner=block.querySelector(".e-block-inner");
    let content;
    if(type==="image"){const img=inner.querySelector("img");content=img?img.src:"";}
    else content=inner.innerHTML;
    blocks.push({type,left:block.style.left,top:block.style.top,width:block.style.width||null,height:block.style.height||null,content});
  });
  const slug=editingSlug||slugify(title);
  const payload={title,location,slug,blocks,createdAt:Date.now(),author:currentUser?currentUser.username:"Anonim"};
  setStatus("Kaydediliyor…");
  if(isAdmin()){
    db.ref("articles/"+slug).set(payload,err=>{
      if(err){alert("Hata: "+err.message);setStatus("Hata!");return;}
      setStatus("Kaydedildi! ✅");navigate("article/"+slug);
    });
  }else{
    const pkey=slug+"_"+Date.now();
    db.ref("pending/"+pkey).set(payload,err=>{
      if(err){alert("Hata: "+err.message);setStatus("Hata!");return;}
      setStatus("Onaya gönderildi! ✅");
      document.getElementById("main-content").innerHTML=`
        <div class="page-wrap"><div class="page-body">
          <div class="notice success">✅ İçeriğiniz admin onayına gönderildi!</div>
          <button class="btn-save" onclick="goHome()" style="margin-top:12px">🏠 Ana Sayfaya Dön</button>
        </div></div>`;
    });
  }
}

/* ══ SEARCH ══ */
function doSearch(){
  const q=(document.getElementById("search-input").value||"").trim().toLowerCase();
  if(!q)return;
  setStatus("Aranıyor: "+q);
  db.ref("articles").once("value",snap=>{
    const data=snap.val();
    const el=document.getElementById("main-content");
    if(!data){el.innerHTML=`<div class="page-wrap"><div class="page-body"><div class="notice warn">Sonuç bulunamadı.</div></div></div>`;return;}
    const res=Object.values(data).filter(a=>
      a.title.toLowerCase().includes(q)||(a.blocks||[]).some(b=>b.type==="text"&&stripTags(b.content).toLowerCase().includes(q)));
    document.title=`"${q}" — Bilinmeyen Dünya`;
    el.innerHTML=`
      <div class="page-wrap">
        <div class="page-tabs"><span class="page-tab active">🔍 Arama</span></div>
        <div class="page-body">
          <h1 class="article-title-h1">Arama: "${escHtml(q)}"</h1>
          <p style="color:var(--muted);margin-bottom:14px;font-family:var(--font-ui);font-size:13px;">${res.length} sonuç</p>
          ${res.length?res.map(a=>`<div class="article-card">
            <div class="article-card-title"><a onclick="navigate('article/${a.slug}')">${escHtml(a.title)}</a></div>
            <div class="article-card-meta">📍 ${escHtml(a.location||"Anonim")} &bull; 📅 ${new Date(a.createdAt).toLocaleDateString("tr-TR")}</div>
          </div>`).join(""):'<div class="empty-state">📭 Sonuç bulunamadı.</div>'}
        </div>
      </div>`;
    setStatus(res.length+" sonuç");
  });
}
